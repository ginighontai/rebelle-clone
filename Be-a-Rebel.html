// The Tilt panel is a real control for the watercolor gravity/runoff simulation: click the
// center circle to turn tilt on/off, drag the pointer to set direction & angle (line length
// = angle/strength). See canvasTilt (state) and the tilt-aware code in simulateLayer().
function buildTilt(){
  document.getElementById('tiltBody').innerHTML=
    `<div class="tiltDial" id="tiltDial">
       <div class="ring"></div>
       <div class="pointerLine" id="tiltLine"></div>
       <div class="dot" id="tiltDot"></div>
       <div class="center" id="tiltCenter"></div>
     </div>
     <p class="tinyNote" style="text-align:center" id="tiltReadout">Tilt off</p>
     <p class="tinyNote" style="text-align:center">Click the center to enable, drag the pointer to set direction. Alt+T toggles.</p>`;
  wireTiltDial();
  updateTiltDial();
}
function tiltAngleToXY(angleDeg,len){
  const rad=angleDeg*Math.PI/180;
  return {x:Math.cos(rad)*len,y:Math.sin(rad)*len};
}
function updateTiltDial(){
  const dial=document.getElementById('tiltDial'); if(!dial) return;
  dial.classList.toggle('on',canvasTilt.enabled);
  dial.classList.toggle('accel',canvasTilt.useAccelerometer);
  const R=30; // px radius of the dial's usable pointer travel
  const len=clamp(canvasTilt.strength,0,1)*R;
  const pt=tiltAngleToXY(canvasTilt.angle,len);
  const dot=document.getElementById('tiltDot'); if(dot) dot.style.transform=`translate(-50%,-50%) translate(${pt.x}px,${pt.y}px)`;
  const line=document.getElementById('tiltLine');
  if(line){ line.style.width=Math.max(0,len)+'px'; line.style.transform=`translateY(-50%) rotate(${canvasTilt.angle}deg)`; }
  const r=document.getElementById('tiltReadout');
  if(r) r.textContent = canvasTilt.enabled ? (Math.round(canvasTilt.angle)+'°, strength '+Math.round(canvasTilt.strength*100)+'%') : 'Tilt off';
}
function setTiltFromClientPoint(dial,clientX,clientY){
  const rect=dial.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  const dx=clientX-cx, dy=clientY-cy;
  const R=rect.width/2-6;
  const angle=Math.atan2(dy,dx)*180/Math.PI;
  const strength=clamp(Math.hypot(dx,dy)/R,0,1);
  canvasTilt.angle=angle; canvasTilt.strength=strength;
  if(strength>0.04) canvasTilt.enabled=true;
  updateTiltDial();
}
function wireTiltDial(){
  const dial=document.getElementById('tiltDial'), center=document.getElementById('tiltCenter');
  if(!dial) return;
  let dragging=false;
  center.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    canvasTilt.enabled=!canvasTilt.enabled;
    updateTiltDial();
  });
  dial.addEventListener('pointerdown',e=>{
    if(e.target===center) return;
    dragging=true; dial.setPointerCapture(e.pointerId);
    setTiltFromClientPoint(dial,e.clientX,e.clientY);
  });
  dial.addEventListener('pointermove',e=>{ if(dragging) setTiltFromClientPoint(dial,e.clientX,e.clientY); });
  dial.addEventListener('pointerup',()=>{ dragging=false; });
  dial.addEventListener('pointercancel',()=>{ dragging=false; });
}
function toggleCanvasTilt(){ canvasTilt.enabled=!canvasTilt.enabled; updateTiltDial(); }
function rotateTilt90(){ canvasTilt.angle=(canvasTilt.angle+90)%360; updateTiltDial(); }
function centerAccelerometer(){ canvasTilt.accelOffset={beta:lastAccel.beta,gamma:lastAccel.gamma}; setStatus('Accelerometer centered'); }
let lastAccel={beta:0,gamma:0};
function applyAccelToTilt(beta,gamma){
  lastAccel={beta,gamma};
  if(!canvasTilt.useAccelerometer) return;
  const db=beta-canvasTilt.accelOffset.beta, dg=gamma-canvasTilt.accelOffset.gamma;
  // Preferences > Tools > Accelerometer Sensitivity (1-10): lower = need a bigger tilt to
  // reach full effect, higher = a small tilt already saturates the runoff strength.
  const sensDivisor=70-(clamp(PREFS.accelerometerSensitivity,1,10)-5)*5;
  canvasTilt.angle=Math.atan2(db,dg)*180/Math.PI;
  canvasTilt.strength=clamp(Math.hypot(db,dg)/sensDivisor,0,1);
  canvasTilt.enabled=canvasTilt.strength>0.03;
  updateTiltDial();
}
window.addEventListener('deviceorientation',e=>{
  if(e.beta==null||e.gamma==null) return;
  applyAccelToTilt(e.beta,e.gamma);
});

// Record Time-lapse panel: previously recording/playback wrote into #previewThumb, which
// lives in the separate "Preview" floating panel — a panel that ships CLOSED by default.
// So Record actually worked (frames were captured and the play loop did run), but nothing
// ever appeared on screen unless you happened to also have opened the unrelated Preview
// panel — indistinguishable from "recording/playing nothing". This gives the Record panel
// its own always-visible preview thumbnail, a visible frame counter that updates live while
// recording, and a play/pause toggle with real feedback instead of a silent one-shot.
function buildRecord(){
  document.getElementById('recordBody').innerHTML=`
   <div class="miniCanvasWrap" style="margin-bottom:6px"><canvas id="recPreviewThumb" width="160" height="100"></canvas></div>
   <div class="layerToolbar">
     <button id="recBtn">${timelapse.recording?'■ Stop':'● Record'}</button>
     <button id="recPlay" ${timelapse.frames.length?'':'disabled'}>${timelapse.playing?'⏸ Pause':'▶ Play'}</button>
     <button id="recClear" ${timelapse.frames.length?'':'disabled'}>Clear</button>
   </div>
   <div class="layerToolbar">
     <button id="recDownloadVideo" ${timelapse.frames.length?'':'disabled'}>⬇ Download Video (.webm)</button>
   </div>
   <div class="layerToolbar">
     <button id="recDownloadFrames" ${timelapse.frames.length?'':'disabled'}>⬇ Download Frames (.jpg)</button>
   </div>
   <span class="tinyNote" id="recStatus">Idle</span>
   <p class="tinyNote">Frames are kept only in memory while this tab stays open — nothing is auto-saved to disk. Download before closing or reloading the page, or the recording is lost.</p>`;
  document.getElementById('recBtn').onclick=toggleRecord;
  document.getElementById('recPlay').onclick=togglePlayTimelapse;
  document.getElementById('recClear').onclick=()=>{ timelapse.frames=[]; timelapse.playing=false; updateRecordStatus(); };
  document.getElementById('recDownloadVideo').onclick=exportTimelapseVideo;
  document.getElementById('recDownloadFrames').onclick=exportTimelapseFrames;
  drawRecordThumb(canvas); // show the current canvas immediately instead of a blank box
  updateRecordStatus();
}
let recTimer=null;
function toggleRecord(){
  timelapse.recording=!timelapse.recording;
  if(timelapse.recording){
    timelapse.startedAt=Date.now();
    captureFrame(); // capture an immediate first frame so "0 frames" isn't shown for 1.5s
    recTimer=setInterval(captureFrame,1500);
  } else {
    clearInterval(recTimer); recTimer=null;
  }
  updateRecordStatus();
}
function captureFrame(){
  try{
    const url=canvas.toDataURL('image/jpeg',0.6);
    timelapse.frames.push(url);
    if(timelapse.frames.length>200) timelapse.frames.shift();
    const c=document.getElementById('recPreviewThumb'); if(c) drawRecordThumb(canvas);
  }catch(e){
    // Only realistic cause: a cross-origin image was drawn onto the canvas (e.g. a Reference
    // Image loaded from a URL rather than a local file), which taints canvas.toDataURL().
    timelapse.recording=false; clearInterval(recTimer); recTimer=null;
    setStatus('Recording stopped: the canvas contains cross-origin image data and cannot be captured');
  }
  updateRecordStatus();
}
function drawRecordThumb(source){
  const c=document.getElementById('recPreviewThumb'); if(!c) return;
  const tc=c.getContext('2d'); tc.clearRect(0,0,c.width,c.height); tc.drawImage(source,0,0,c.width,c.height);
}
function updateRecordStatus(){
  const el=document.getElementById('recStatus'); if(!el) return;
  el.textContent=timelapse.recording?('Recording… '+timelapse.frames.length+' frame'+(timelapse.frames.length===1?'':'s'))
    :timelapse.playing?('Playing… frame '+(timelapse.playIdx+1)+' / '+timelapse.frames.length)
    :(timelapse.frames.length?timelapse.frames.length+' frame'+(timelapse.frames.length===1?'':'s')+' captured':'Idle — click Record to start a time-lapse');
  const btn=document.getElementById('recBtn'); if(btn) btn.textContent=timelapse.recording?'■ Stop':'● Record';
  const playBtn=document.getElementById('recPlay'); if(playBtn){ playBtn.disabled=!timelapse.frames.length; playBtn.textContent=timelapse.playing?'⏸ Pause':'▶ Play'; }
  const clearBtn=document.getElementById('recClear'); if(clearBtn) clearBtn.disabled=!timelapse.frames.length;
  const dv=document.getElementById('recDownloadVideo'); if(dv) dv.disabled=!timelapse.frames.length;
  const df=document.getElementById('recDownloadFrames'); if(df) df.disabled=!timelapse.frames.length;
}
let recPlayTimer=null;
function togglePlayTimelapse(){
  if(timelapse.playing){ timelapse.playing=false; clearTimeout(recPlayTimer); updateRecordStatus(); drawRecordThumb(canvas); return; }
  playTimelapse();
}
function playTimelapse(){
  if(!timelapse.frames.length) return;
  timelapse.playing=true; timelapse.playIdx=0;
  const tick=()=>{
    if(!timelapse.playing||timelapse.playIdx>=timelapse.frames.length){
      timelapse.playing=false; updateRecordStatus();
      drawRecordThumb(canvas); // end of playback: show the live canvas again, not a stale frame
      return;
    }
    const im=new Image();
    im.onload=()=>{ drawRecordThumb(im); const pc=document.getElementById('previewThumb'); if(pc){ const ptc=pc.getContext('2d'); ptc.clearRect(0,0,pc.width,pc.height); ptc.drawImage(im,0,0,pc.width,pc.height); } };
    im.src=timelapse.frames[timelapse.playIdx];
    updateRecordStatus();
    timelapse.playIdx++;
    recPlayTimer=setTimeout(tick,120);
  };
  tick();
}
function buildPreview(){
  document.getElementById('previewBody').innerHTML=`<div class="miniCanvasWrap"><canvas id="previewThumb" width="160" height="100"></canvas></div><p class="tinyNote">Mirrors the Record Time-lapse panel's playback — keep both open to preview at two sizes at once.</p>`;

// Renders a small preview swatch canvas for a paper key, showing its actual tooth/grain/tint
// pattern plus a quick simulated wash so users can see how paint diffuses on it (Instant
// Paper Preview) without leaving the panel or committing to the surface.
function renderPaperPreviewSwatch(canvasEl,key){
  const p=PAPERS[key]; if(!p) return;
  const s=48; canvasEl.width=s; canvasEl.height=s;
  const g=canvasEl.getContext('2d');
  const base=hexToRgb(p.tint||p.base);
  const id=g.createImageData(s,s);
  for(let y=0;y<s;y++)for(let x=0;x<s;x++){
    const o=(y*s+x)*4;
    let r,gr,b;
    if(p.heightMap){
      const hm=p.heightMap, tx=(x*4)%hm.w, ty=(y*4)%hm.h, t=hm.data[ty*hm.w+tx], v=(t-0.5)*84;
      r=clamp(base.r+v,0,255); gr=clamp(base.g+v,0,255); b=clamp(base.b+v,0,255);
    } else {
      const n1=noise((x/2)|0,(y/2)|0), n2=noise((x/6)|0,(y/6)|0);
      const weave=p.weave?(Math.sin(x*1.4)+Math.sin(y*1.3)):0;
      const v=(n1-.5)*p.grain*7+(n2-.5)*p.grain*4+weave;
      r=clamp(base.r+v,200,255); gr=clamp(base.g+v,196,255); b=clamp(base.b+v,190,255);
    }
    // A soft simulated blue wash across the lower-right, so absorbency/tooth differences
    // between papers are visible at a glance (higher absorb = softer/more diffused edge).
    const washT=clamp((x+y-s*0.5)/(s*0.9),0,1);
    const softness=1-p.absorb*0.5;
    const edgeNoise=(noise(x*0.3,y*0.3)-0.5)*p.absorb*40*softness;
    const inWash=washT+edgeNoise/s>0.42;
    if(inWash){ r=lerp(r,90,0.55); gr=lerp(gr,150,0.55); b=lerp(b,215,0.55); }
    id.data[o]=r; id.data[o+1]=gr; id.data[o+2]=b; id.data[o+3]=255;
  }
  g.putImageData(id,0,0);
}

const BLEND_MODES=['normal','darken','multiply','colorburn','linearburn','lighten','screen','colordodge','lineardodge',

/* ---- wet/dry layer operations (Layers panel + Layer menu) ---- */
function wetWholeLayer(L){ for(let i=0;i<N;i++) L.wet[i]=Math.max(L.wet[i],0.55); L.wetBounds={minx:0,maxx:W-1,miny:0,maxy:H-1}; markFullDirty(); setStatus('Layer wet'); }
function wetPaintedAreas(L){ for(let i=0;i<N;i++) if(L.pd[i]>0.02) L.wet[i]=Math.max(L.wet[i],0.5); L.wetBounds={minx:0,maxx:W-1,miny:0,maxy:H-1}; markFullDirty(); setStatus('Painted areas wet'); }
function dryTheLayer(L){ L.wet.fill(0); L.wetBounds=null; L.rivulets=[]; markFullDirty(); setStatus('Layer dried'); }
function fastDryLayer(L){ L.wet.fill(0); L.wetBounds=null; L.rivulets=[]; markFullDirty(); } // canvas stays "wet" conceptually; water removed from paint
function setMaskMode(mode){
  const L=activeLayer(); if(!L) return;
  pushUndo();
  L.maskMode=mode;
  if(mode!=='none') L.locked=true;
  recalcMaskLayersFlag(); markFullDirty(); buildLayersPanel();
  setStatus(mode==='none'?'Masking removed':'Masking Fluid: '+mode);
}
function createLayerGroup(){
  pushUndo();
  const id='g'+Date.now().toString(36);
  layerGroups.push({id,name:'Group '+(layerGroups.length+1),visible:true,collapsed:false});
  layers[activeLayerIdx].groupId=id;
  buildLayersPanel(); markFullDirty();
}
function mergeVisibleLayers(){
  const visible=layers.filter(effectiveLayerVisible);
  if(visible.length<2){ setStatus('Need at least 2 visible layers to merge'); return; }
  pushUndo();
  const merged=newLayer('Merged Layer');
  for(let li=layers.length-1; li>=0; li--){
    const L=layers[li]; if(!effectiveLayerVisible(L) || (L.maskMode&&L.maskMode!=='none')) continue;
    for(let i=0;i<N;i++){
      const a=clamp(L.pd[i]*L.opacity,0,1); if(a<=0.001) continue;
      merged.pr[i]=merged.pr[i]*(1-a)+L.pr[i]*a; merged.pg[i]=merged.pg[i]*(1-a)+L.pg[i]*a; merged.pb[i]=merged.pb[i]*(1-a)+L.pb[i]*a;
      merged.pd[i]=clamp(merged.pd[i]+L.pd[i]*L.opacity,0,2.4);
      merged.height[i]=Math.max(merged.height[i],L.height[i]);
    }
  }
  const kept=layers.filter(L=>!effectiveLayerVisible(L) || (L.maskMode&&L.maskMode!=='none'));
  const firstVisibleIdx=layers.findIndex(effectiveLayerVisible);
  kept.splice(Math.max(0,firstVisibleIdx),0,merged);
  layers=kept; activeLayerIdx=Math.min(firstVisibleIdx<0?0:firstVisibleIdx,layers.length-1);
  buildLayersPanel(); markFullDirty(); setStatus('Merged visible layers');
}

  body.querySelectorAll('[data-blend]').forEach(el=>{ el.addEventListener('change',e=>{ layers[+el.dataset.blend].blendMode=e.target.value; markFullDirty(); }); });
  body.querySelectorAll('[data-eye]').forEach(el=>{ el.addEventListener('click',e=>{ e.stopPropagation(); const L=layers[+el.dataset.eye]; L.visible=!L.visible; markFullDirty(); buildLayersPanel(); }); });
  body.querySelectorAll('[data-lock]').forEach(el=>{ el.addEventListener('click',e=>{ e.stopPropagation(); const L=layers[+el.dataset.lock]; L.locked=!L.locked; buildLayersPanel(); }); });
  body.querySelectorAll('[data-lockalpha]').forEach(el=>{ el.addEventListener('click',e=>{ e.stopPropagation(); const L=layers[+el.dataset.lockalpha]; L.lockAlpha=!L.lockAlpha; buildLayersPanel(); }); });
  body.querySelectorAll('[data-lact]').forEach(el=>{ el.addEventListener('click',()=>{

    if(act==='wetlayer'){ pushUndo(); wetWholeLayer(L); }
    else if(act==='wetvisible'){ pushUndo(); wetPaintedAreas(L); }
    else if(act==='drylayer'){ pushUndo(); dryTheLayer(L); }
    else if(act==='fastdry'){ fastDryLayer(L); }
    else if(act==='showwet'){ showWetOverlay=!showWetOverlay; markFullDirty(); render(true); }
    else if(act==='pause'){ pauseDiffusion=!pauseDiffusion; }
    buildLayersPanel();
  }); });
  const mm=document.getElementById('maskModeSel'); if(mm) mm.onchange=e=>setMaskMode(e.target.value);
  document.getElementById('layerAdd').onclick=()=>{ pushUndo(); layers.splice(activeLayerIdx,0,newLayer('Layer '+(layers.length+1))); buildLayersPanel(); buildLayerSettings(); };
  document.getElementById('layerGroupBtn').onclick=createLayerGroup;
  document.getElementById('layerDup').onclick=()=>{ pushUndo(); const L=layers[activeLayerIdx]; const C=newLayer(L.name+' copy'); ['pr','pg','pb','pd','wet','edge','height'].forEach(k=>C[k].set(L[k])); C.opacity=L.opacity; layers.splice(activeLayerIdx,0,C); buildLayersPanel(); markFullDirty(); };
  document.getElementById('layerMerge').onclick=()=>{
    if(activeLayerIdx>=layers.length-1) return;
    pushUndo();
    const top=layers[activeLayerIdx], bot=layers[activeLayerIdx+1];
    for(let i=0;i<N;i++){ const a=clamp(top.pd[i]*top.opacity,0,1); if(a<=0.001) continue;
      bot.pr[i]=bot.pr[i]*(1-a)+top.pr[i]*a; bot.pg[i]=bot.pg[i]*(1-a)+top.pg[i]*a; bot.pb[i]=bot.pb[i]*(1-a)+top.pb[i]*a;
      bot.pd[i]=clamp(bot.pd[i]+top.pd[i]*top.opacity,0,2.4); bot.height[i]=Math.max(bot.height[i],top.height[i]); }

function refreshLayerThumbs(){
  document.querySelectorAll('[data-thumb]').forEach(c=>{
    const L=layers[+c.dataset.thumb]; if(!L) return;
    const tc=c.getContext('2d'); const id=tc.createImageData(c.width,c.height);
    for(let ty=0;ty<c.height;ty++)for(let tx=0;tx<c.width;tx++){
      const sx=Math.floor(tx/c.width*W), sy=Math.floor(ty/c.height*H), si=sy*W+sx;
      const a=clamp(L.pd[si]*L.opacity,0,1);
      const r=lerp(238,L.pr[si],a), g=lerp(226,L.pg[si],a), b=lerp(200,L.pb[si],a);
      const o=(ty*c.width+tx)*4; id.data[o]=r; id.data[o+1]=g; id.data[o+2]=b; id.data[o+3]=255;
    }
    tc.putImageData(id,0,0);
  });
}

/* ---- My Colors (PRO: Smarter Asset Management for the color library) ----
   A user-managed color palette supporting multi-select (Ctrl/Shift-click), drag-and-drop
   reordering, and single-swatch removal — persisted the same way as My Brushes/My Papers. */
let myColors=['#000000','#c0417f','#2c5fe0','#159a55','#e2402f','#f2b400','#101010','#7a4d2c','#00a6c8','#7c3dff','#ffffff','#f97316','#5b6b12','#8fd3ff','#ffd166','#d1495b','#06d6a0'];
let selectedSwatchKeys=new Set();
let lastClickedSwatch=null;
async function persistMyColors(){ if(!HAS_STORAGE) return; await storageSet('my-colors',JSON.stringify(myColors),false); }
async function loadMyColors(){
  const raw=await storageGet('my-colors',false); if(!raw) return;
  try{ const arr=JSON.parse(raw); if(Array.isArray(arr)&&arr.length) myColors=arr; }catch(e){}
}
function renderMyColorsPalette(){
  const el=document.getElementById('paletteSwatches'); if(!el) return;
  el.innerHTML=myColors.map((c,idx)=>`<button class="sw ${selectedSwatchKeys.has(c)?'multiSelected':''}" style="background:${c};position:relative" data-c="${c}" data-idx="${idx}" draggable="true">
    <span class="swRemove" data-removesw="${c}" title="Remove">✕</span></button>`).join('');
  el.querySelectorAll('.sw').forEach(b=>{
    b.addEventListener('click',(e)=>{
      if(e.target.closest('[data-removesw]')) return;
      const c=b.dataset.c;
      if(e.ctrlKey||e.metaKey){ if(selectedSwatchKeys.has(c)) selectedSwatchKeys.delete(c); else selectedSwatchKeys.add(c); lastClickedSwatch=c; buildColorPanel(); return; }
      if(e.shiftKey && lastClickedSwatch!=null){
        const a=myColors.indexOf(lastClickedSwatch), d=myColors.indexOf(c);
        if(a>=0&&d>=0){ const [lo,hi]=a<d?[a,d]:[d,a]; for(let k=lo;k<=hi;k++) selectedSwatchKeys.add(myColors[k]); buildColorPanel(); return; }
      }
      selectedSwatchKeys.clear(); lastClickedSwatch=c;
      setColor(c);
    });

function drawColorWheel(){

  const cx2=c.getContext('2d'); const w=c.width,h=c.height,cx=w/2,cy=h/2,R=Math.min(cx,cy)-2;
  const id=cx2.createImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const dx=x-cx, dy=y-cy, rad=Math.hypot(dx,dy)/R, o=(y*w+x)*4;
    if(rad>1){ id.data[o+3]=0; continue; }

const STENCIL_DEFS={none:{name:'None'},dots:{name:'Dots'},stripes:{name:'Stripes'},rings:{name:'Rings'},leaf:{name:'Scatter'}};
function makeStencilCanvas(key){
  const c=document.createElement('canvas'); c.width=64;c.height=64; const g=c.getContext('2d');
  g.clearRect(0,0,64,64); g.fillStyle='#fff'; g.strokeStyle='#fff';
  if(key==='dots'){ for(let y=8;y<64;y+=16)for(let x=8;x<64;x+=16){ g.beginPath();g.arc(x,y,5,0,Math.PI*2);g.fill(); } }
  else if(key==='stripes'){ for(let x=-8;x<80;x+=14){ g.save();g.translate(x,0);g.rotate(0.5);g.fillRect(0,-20,6,110);g.restore(); } }
  else if(key==='rings'){ g.lineWidth=4; g.beginPath(); g.arc(32,32,22,0,Math.PI*2); g.stroke(); g.beginPath(); g.arc(32,32,10,0,Math.PI*2); g.stroke(); }
  else if(key==='leaf'){ for(let i=0;i<10;i++){ const x=noise(i,1)*64,y=noise(i,2)*64; g.beginPath(); g.ellipse(x,y,5,3,noise(i,3)*6,0,Math.PI*2); g.fill(); } }
  else { g.fillRect(0,0,64,64); }
  return c;
}

function stampPathShape(shape){
  const L=activeLayer(); if(!L||L.locked) return;
  const cx=W/2, cy=H/2, size=Math.min(W,H)*0.18;
  const col=currentColorRGB();
  forEachInDab(cx,cy,size,size,0,1,(px,py,i,rr)=>{
    let inside=false;
    if(shape==='bubble') inside=rr<=1;
    else if(shape==='tear') inside = rr<=1 && (py-cy) > -(size*(1-rr));
    else if(shape==='triangle'){ const lx=(px-cx)/size, ly=(py-cy)/size; inside = ly>-0.9 && ly<(0.9-Math.abs(lx)*1.4); }
    else if(shape==='cross'){ const lx=Math.abs(px-cx), ly=Math.abs(py-cy); inside = (lx<size*0.18)||(ly<size*0.18); }
    if(!inside) return;
    L.pr[i]=col.r;L.pg[i]=col.g;L.pb[i]=col.b;L.pd[i]=Math.max(L.pd[i],0.9);
  });
  L.dirty=true; markRenderDirty(cx,cy,size+6);
}

function dryCanvas(){ pushUndo(); layers.forEach(L=>{ L.wet.fill(0); L.wetBounds=null; L.rivulets=[]; }); setStatus('Canvas dried'); }

/* ---- Impasto Heightmap Export (PRO) ----
   Real Rebelle exports a 16-bit EXR with height + color data for 3D pipeline integration.
   Browsers have no built-in EXR encoder (OpenEXR is a compressed binary format with no
   native Web API and no safe hand-rollable implementation we could verify actually opens
   correctly), so this exports the honest practical equivalent:
     1. A .pfm (Portable Float Map) file for the height channel — genuine IEEE-754 float32
        precision, a real uncompressed format most 3D/VFX tools (Blender, Nuke, etc.) can
        read directly or convert to EXR in one step.
     2. A 16-bit grayscale PNG of the same height data for tools that prefer PNG.
     3. The flattened color composite as a normal PNG, aligned pixel-for-pixel with both. */
function exportImpastoHeightmap(){
  const L=activeLayer(); if(!L){ setStatus('No active layer to export'); return; }
  render(true);
  // 1) PFM float32 heightmap (uncompressed, industry-standard for HDR/height data exchange).
  // PFM's scale-factor sign encodes byte order per spec: negative = little-endian, which is
  // what Float32Array's underlying buffer actually is on essentially all consumer hardware/browsers.
  const header=`Pf\n${W} ${H}\n-1.0\n`;
  const headerBytes=new TextEncoder().encode(header);
  const floatBytes=new Float32Array(W*H);
  // PFM stores rows bottom-to-top by convention.
  for(let y=0;y<H;y++){
    const srcY=H-1-y;
    for(let x=0;x<W;x++) floatBytes[y*W+x]=L.height[srcY*W+x]/3.2; // normalize to 0..1
  }
  const pfmBlob=new Blob([headerBytes,floatBytes.buffer],{type:'application/octet-stream'});
  const pfmName=(L.name||'layer').replace(/[^a-z0-9]+/gi,'_')+'_height.pfm';
  const a1=document.createElement('a'); a1.href=URL.createObjectURL(pfmBlob); a1.download=pfmName; a1.click();
  setTimeout(()=>URL.revokeObjectURL(a1.href),4000);
  // 2) 16-bit-precision grayscale PNG (packed as two 8-bit channels: R=high byte, G=low byte,
  // so no precision is lost the way a naive 8-bit PNG would lose it — a common technique for
  // smuggling 16-bit data through an 8-bit-per-channel PNG encoder).
  const c=document.createElement('canvas'); c.width=W;c.height=H;
  const g=c.getContext('2d'); const id=g.createImageData(W,H);
  for(let i=0;i<N;i++){
    const v16=clamp(Math.round((L.height[i]/3.2)*65535),0,65535);
    const o=i*4; id.data[o]=(v16>>8)&255; id.data[o+1]=v16&255; id.data[o+2]=0; id.data[o+3]=255;
  }
  g.putImageData(id,0,0);
  const a2=document.createElement('a'); a2.href=c.toDataURL('image/png'); a2.download=(L.name||'layer').replace(/[^a-z0-9]+/gi,'_')+'_height16.png'; a2.click();
  // 3) Flattened color composite, aligned to the same layer.
  const a3=document.createElement('a'); a3.href=canvas.toDataURL('image/png'); a3.download=(L.name||'layer').replace(/[^a-z0-9]+/gi,'_')+'_color.png'; a3.click();
  setStatus('Exported impasto height (.pfm float32 + 16-bit PNG, R=high byte/G=low byte) and color map for "'+L.name+'"');
}
// Export to Photoshop: the real Escape Motions Connect plug-in round-trips live with a
// running Photoshop instance over a local bridge, which a static HTML file can't do. This
// gives the practical equivalent — the active layer's own pixels (not the flattened
// composite) exported as a transparent PNG, ready to open/paste as a new PS layer.
function exportLayerToPhotoshop(){
  const L=activeLayer(); if(!L) return;
  const c=document.createElement('canvas'); c.width=W;c.height=H;
  const g=c.getContext('2d'); const id=g.createImageData(W,H);
  for(let i=0;i<N;i++){ const o=i*4, a=clamp(L.pd[i],0,1); id.data[o]=L.pr[i];id.data[o+1]=L.pg[i];id.data[o+2]=L.pb[i];id.data[o+3]=a*255; }
  g.putImageData(id,0,0);
  const a=document.createElement('a'); a.href=c.toDataURL('image/png'); a.download=(L.name||'layer').replace(/[^a-z0-9]+/gi,'_')+'.png'; a.click();
  setStatus('Exported "'+L.name+'" as a transparent PNG (Photoshop plug-in bridge not available in this build)');
}
// Time-lapse frames only ever lived in the in-memory `timelapse.frames` array (JPEG data
// URLs) — never written to disk, browser storage, or anywhere persistent. That's why there
// was no "where is it stored" answer: it wasn't stored anywhere durable, and closing/
// reloading the page always discarded it silently. These two functions are the actual
// download path: one combines every frame into a single playable .webm video (the option
// most people actually want), the other still offers the individual frames as separate
// JPGs for anyone who wants to edit them in another tool.
function exportTimelapseFrames(){
  if(!timelapse.frames.length){ setStatus('No time-lapse frames captured yet'); return; }
  if(timelapse.frames.length>12) setStatus('Downloading '+timelapse.frames.length+' frames — your browser will likely ask to allow multiple downloads from this page.');
  // Stagger downloads instead of firing them all in the same tick: browsers commonly block
  // or silently drop rapid-fire programmatic downloads beyond the first few.
  timelapse.frames.forEach((f,idx)=>{
    setTimeout(()=>{ const a=document.createElement('a'); a.href=f; a.download='be-a-rebel-timelapse_'+String(idx).padStart(3,'0')+'.jpg'; a.click(); },idx*120);
  });
}
function exportTimelapseVideo(){
  if(!timelapse.frames.length){ setStatus('No time-lapse frames captured yet'); return; }
  const canCaptureStream = !!(document.createElement('canvas').captureStream) && typeof MediaRecorder!=='undefined';
  if(!canCaptureStream){
    setStatus('This browser lacks canvas.captureStream/MediaRecorder for video export — downloading individual JPG frames instead');
    exportTimelapseFrames();
    return;
  }
  const frames=timelapse.frames.slice();
  const off=document.createElement('canvas'); off.width=W; off.height=H;
  const octx=off.getContext('2d');
  const fps=8;
  const stream=off.captureStream(fps);
  let mimeType='video/webm;codecs=vp9';
  if(!MediaRecorder.isTypeSupported(mimeType)) mimeType=MediaRecorder.isTypeSupported('video/webm')?'video/webm':'';
  let rec;
  try{ rec=mimeType?new MediaRecorder(stream,{mimeType}):new MediaRecorder(stream); }
  catch(e){ setStatus('Video export failed to start — downloading individual JPG frames instead'); exportTimelapseFrames(); return; }
  const chunks=[];
  rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  rec.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='be-a-rebel-timelapse.webm'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    setStatus('Time-lapse video downloaded ('+frames.length+' frames, .webm)');
  };
  rec.start();
  setStatus('Encoding time-lapse video from '+frames.length+' frames…');
  let idx=0;
  const holdMs=1000/fps;
  const drawNext=()=>{
    if(idx>=frames.length){ setTimeout(()=>rec.stop(),holdMs*2); return; }
    const im=new Image();
    im.onload=()=>{ octx.clearRect(0,0,W,H); octx.drawImage(im,0,0,W,H); idx++; setTimeout(drawNext,holdMs); };
    im.onerror=()=>{ idx++; setTimeout(drawNext,holdMs); };
    im.src=frames[idx];
  };
  drawNext();
}

/* ======================= Filter menu ======================= */
// All filters operate on the active layer's pigment color (pr/pg/pb), respecting the
// current selection (if any), and only touch pixels that actually carry paint (pd>0.002)
// so we never manufacture color on blank paper. Filters open a live-preview modal: opening
// the modal pushes one undo step immediately (so Cancel/Apply both leave a single clean
// undo entry), sliders recompute from a pristine snapshot each time, Cancel restores it.
function rgbToHsl(r,g,b){
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0,s=0; const l=(mx+mn)/2;
  const d=mx-mn;
  if(d>0.0001){
    s=d/(1-Math.abs(2*l-1));
    if(mx===r) h=60*(((g-b)/d)%6); else if(mx===g) h=60*((b-r)/d+2); else h=60*((r-g)/d+4);
  }
  if(h<0) h+=360;
  return {h,s,l};
}
function hslToRgb(h,s,l){
  h=((h%360)+360)%360;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  return {r:(r+m)*255,g:(g+m)*255,b:(b+m)*255};
}
function filterTargetLayer(){ return activeLayer(); }
function filterEachPixel(L,fn){
  for(let i=0;i<N;i++){
    if(L.pd[i]<=0.002) continue;
    const px=i%W, py=(i/W)|0;
    if(!inSelection(px,py)) continue;
    fn(i);
  }
}
function openFilterModal(title,bodyHTML,onInput,onApply){
  const L=filterTargetLayer(); if(!L) return;
  pushUndo();
  const pre={pr:L.pr.slice(),pg:L.pg.slice(),pb:L.pb.slice(),pd:L.pd.slice()};
  openModal(`<h4>${title}</h4>${bodyHTML}<div class="mbtns"><button class="qbtn" id="fltCancel">Cancel</button><button class="qbtn primary" id="fltApply">Apply</button></div>`);
  const recompute=(params)=>{ L.pr.set(pre.pr); L.pg.set(pre.pg); L.pb.set(pre.pb); L.pd.set(pre.pd); onInput(L,params); markFullDirty(); render(true); };
  document.querySelectorAll('#modalBox [data-fparam]').forEach(el=>{
    el.addEventListener('input',()=>{
      const params={};
      document.querySelectorAll('#modalBox [data-fparam]').forEach(e2=>{ params[e2.dataset.fparam]=e2.type==='checkbox'?e2.checked:parseFloat(e2.value); });
      document.querySelectorAll('#modalBox [data-fout]').forEach(o=>{ const src=document.querySelector(`#modalBox [data-fparam="${o.dataset.fout}"]`); if(src) o.textContent=src.value; });
      recompute(params);
    });
  });
  document.getElementById('fltCancel').onclick=()=>{
    L.pr.set(pre.pr); L.pg.set(pre.pg); L.pb.set(pre.pb); L.pd.set(pre.pd);
    markFullDirty(); render(true);
    undoStack.pop(); updateUndoRedoUI();
    closeModal();
  };
  document.getElementById('fltApply').onclick=()=>{ if(onApply) onApply(); closeModal(); setStatus(title+' applied'); };
};
function filterBrightnessContrast(){
  openFilterModal('Brightness / Contrast',
    `<div class="mrow"><label>Brightness</label><input type="range" data-fparam="b" min="-100" max="100" value="0"><output data-fout="b">0</output></div>
     <div class="mrow"><label>Contrast</label><input type="range" data-fparam="c" min="-100" max="100" value="0"><output data-fout="c">0</output></div>`,
    (L,p)=>{
      const bAdd=(p.b||0)*2.55, cf=(259*((p.c||0)+255))/(255*(259-(p.c||0)));
      filterEachPixel(L,i=>{
        L.pr[i]=clamp(cf*(L.pr[i]-128+bAdd)+128,0,255);
        L.pg[i]=clamp(cf*(L.pg[i]-128+bAdd)+128,0,255);
        L.pb[i]=clamp(cf*(L.pb[i]-128+bAdd)+128,0,255);
      });
    });
}
function filterHueSaturation(){
  openFilterModal('Hue / Saturation',
    `<div class="mrow"><label>Hue</label><input type="range" data-fparam="h" min="-180" max="180" value="0"><output data-fout="h">0</output></div>
     <div class="mrow"><label>Saturation</label><input type="range" data-fparam="s" min="-100" max="100" value="0"><output data-fout="s">0</output></div>
     <div class="mrow"><label>Lightness</label><input type="range" data-fparam="l" min="-100" max="100" value="0"><output data-fout="l">0</output></div>`,
    (L,p)=>{
      const dh=p.h||0, ds=(p.s||0)/100, dl=(p.l||0)/100;
      filterEachPixel(L,i=>{
        const hsl=rgbToHsl(L.pr[i],L.pg[i],L.pb[i]);
        hsl.h+=dh; hsl.s=clamp(hsl.s+ds,0,1); hsl.l=clamp(hsl.l+dl,0,1);
        const rgb=hslToRgb(hsl.h,hsl.s,hsl.l);
        L.pr[i]=rgb.r; L.pg[i]=rgb.g; L.pb[i]=rgb.b;
      });
    });
}
function filterInvert(){
  const L=filterTargetLayer(); if(!L) return;
  pushUndo();
  filterEachPixel(L,i=>{ L.pr[i]=255-L.pr[i]; L.pg[i]=255-L.pg[i]; L.pb[i]=255-L.pb[i]; });
  markFullDirty(); render(true); setStatus('Invert applied');
}
function filterDesaturate(){
  openFilterModal('Desaturate',
    `<div class="mrow"><label>Method</label><select data-fparam="__skip" id="desatMethod"><option value="lum">Luminosity</option><option value="avg">Average</option></select></div>`,
    (L,p)=>{
      const method=document.getElementById('desatMethod')?document.getElementById('desatMethod').value:'lum';
      filterEachPixel(L,i=>{
        const g = method==='avg' ? (L.pr[i]+L.pg[i]+L.pb[i])/3 : (L.pr[i]*0.299+L.pg[i]*0.587+L.pb[i]*0.114);
        L.pr[i]=g; L.pg[i]=g; L.pb[i]=g;
      });
    });
  const sel=document.getElementById('desatMethod'); if(sel) sel.addEventListener('change',()=>document.querySelector('#modalBox [data-fparam]')?.dispatchEvent(new Event('input')));
}
function filterColorBalance(){
  openFilterModal('Color Balance',
    `<p class="tinyNote">Cyan-Red / Magenta-Green / Yellow-Blue, applied evenly across the layer.</p>
     <div class="mrow"><label>Cyan–Red</label><input type="range" data-fparam="r" min="-100" max="100" value="0"><output data-fout="r">0</output></div>
     <div class="mrow"><label>Magenta–Green</label><input type="range" data-fparam="g" min="-100" max="100" value="0"><output data-fout="g">0</output></div>
     <div class="mrow"><label>Yellow–Blue</label><input type="range" data-fparam="b" min="-100" max="100" value="0"><output data-fout="b">0</output></div>
     <div class="mrow chk"><label>Preserve Luminosity</label><input type="checkbox" data-fparam="pl" checked></div>`,
    (L,p)=>{
      const dr=(p.r||0)*1.4, dg=(p.g||0)*1.4, db=(p.b||0)*1.4;
      filterEachPixel(L,i=>{
        const beforeL = p.pl ? (L.pr[i]*0.299+L.pg[i]*0.587+L.pb[i]*0.114) : null;
        let r=clamp(L.pr[i]+dr,0,255), g=clamp(L.pg[i]+dg,0,255), b=clamp(L.pb[i]+db,0,255);
        if(p.pl){
          const afterL=(r*0.299+g*0.587+b*0.114), diff=beforeL-afterL;
          r=clamp(r+diff,0,255); g=clamp(g+diff,0,255); b=clamp(b+diff,0,255);
        }
        L.pr[i]=r; L.pg[i]=g; L.pb[i]=b;
      });
    });
}
/* ---- Color Range (Filter menu): builds a selection from color similarity, so subsequent
   filters/paint only affect that color family. Inner Range picks how close a color must be;
   outer Feather softens the resulting selection edge (same technique as Select > Feather). ---- */
let colorRangePickedColor=null;
function filterColorRange(){
  const L=filterTargetLayer(); if(!L) return;
  colorRangePickedColor=colorRangePickedColor||currentColorRGB();
  openModal(`<h4>Color Range</h4>
    <div class="mrow"><label>Picked Color</label><div class="box" id="crSwatch" style="width:28px;height:20px;border:1px solid #000;background:${rgbToHex(colorRangePickedColor.r,colorRangePickedColor.g,colorRangePickedColor.b)}"></div></div>
    <button class="qbtn" id="crPickBtn" style="width:100%;margin:4px 0">Pick Color From Canvas</button>
    <div class="mrow"><label>Range</label><input type="range" id="crRange" min="1" max="100" value="30"><output id="crRangeOut">30</output></div>
    <div class="mrow"><label>Feather</label><input type="range" id="crFeather" min="0" max="40" value="6"><output id="crFeatherOut">6</output></div>
    <div class="mbtns"><button class="qbtn" id="crCancel">Cancel</button><button class="qbtn primary" id="crApply">Create Selection</button></div>`);
  document.getElementById('crRange').oninput=e=>document.getElementById('crRangeOut').textContent=e.target.value;
  document.getElementById('crFeather').oninput=e=>document.getElementById('crFeatherOut').textContent=e.target.value;
  let picking=false;
  document.getElementById('crPickBtn').onclick=()=>{ picking=true; closeModal(); setStatus('Color Range: click the canvas to pick a color'); pendingColorRangePick=true; };
  document.getElementById('crCancel').onclick=closeModal;
  document.getElementById('crApply').onclick=()=>{
    const range=(parseInt(document.getElementById('crRange').value)||30)/100;
    const feather=parseInt(document.getElementById('crFeather').value)||6;
    render(true);
    const data=image.data;
    const tR=colorRangePickedColor.r, tG=colorRangePickedColor.g, tB=colorRangePickedColor.b;
    const f=new Float32Array(N);
    for(let i=0,o=0;i<N;i++,o+=4){
      const d=(Math.abs(data[o]-tR)+Math.abs(data[o+1]-tG)+Math.abs(data[o+2]-tB))/765;
      f[i]=d<=range?1:0;
    }
    if(feather>0) boxBlurPass(f,W,H,feather);
    const m=new Uint8Array(N); for(let i=0;i<N;i++) m[i]=f[i]>0.5?1:0;
    selectionMask=m; selOverlayDirty=true; renderSelectionOverlay();
    closeModal(); setStatus('Color Range selection created');
  };
}
let pendingColorRangePick=false;

        if(p.pl){ const afterL=(r*0.299+g*0.587+b*0.114), diff=beforeL-afterL; r=clamp(r+diff,0,255); g=clamp(g+diff,0,255); b=clamp(b+diff,0,255); }
        L.pr[i]=r; L.pg[i]=g; L.pb[i]=b;
      });

function filterColorize(){
  openFilterModal('Colorize',
    `<div class="mrow"><label>Hue</label><input type="range" data-fparam="h" min="0" max="360" value="200"><output data-fout="h">200</output></div>
     <div class="mrow"><label>Saturation</label><input type="range" data-fparam="s" min="0" max="100" value="50"><output data-fout="s">50</output></div>
     <div class="mrow"><label>Strength</label><input type="range" data-fparam="st" min="0" max="100" value="100"><output data-fout="st">100</output></div>`,
    (L,p)=>{
      const h=p.h!=null?p.h:200, s=(p.s!=null?p.s:50)/100, st=(p.st!=null?p.st:100)/100;
      filterEachPixel(L,i=>{
        const lum=rgbToHsl(L.pr[i],L.pg[i],L.pb[i]).l;
        const rgb=hslToRgb(h,s,lum);
        L.pr[i]=lerp(L.pr[i],rgb.r,st); L.pg[i]=lerp(L.pg[i],rgb.g,st); L.pb[i]=lerp(L.pb[i],rgb.b,st);
      });
    });
}
function filterGaussianBlur(){
  openFilterModal('Gaussian Blur',
    `<div class="mrow"><label>Radius</label><input type="range" data-fparam="r" min="1" max="24" value="4"><output data-fout="r">4</output></div>`,
    (L,p)=>{
      const radius=Math.round(p.r||4);
      const src=[L.pr.slice(),L.pg.slice(),L.pb.slice(),L.pd.slice()];
      boxBlurPass(src[0],W,H,radius); boxBlurPass(src[1],W,H,radius); boxBlurPass(src[2],W,H,radius); boxBlurPass(src[3],W,H,radius);
      for(let i=0;i<N;i++){ if(src[3][i]<=0.002) continue; L.pr[i]=src[0][i]; L.pg[i]=src[1][i]; L.pb[i]=src[2][i]; L.pd[i]=src[3][i]; }
    });
}
function boxBlurPass(arr,w,h,radius){
  const tmp=new Float32Array(arr.length);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      let sum=0,cnt=0;
      for(let k=-radius;k<=radius;k++){ const xx=x+k; if(xx<0||xx>=w) continue; sum+=arr[y*w+xx]; cnt++; }
      tmp[y*w+x]=sum/cnt;
    }
  }
  for(let x=0;x<w;x++){
    for(let y=0;y<h;y++){
      let sum=0,cnt=0;
      for(let k=-radius;k<=radius;k++){ const yy=y+k; if(yy<0||yy>=h) continue; sum+=tmp[yy*w+x]; cnt++; }
      arr[y*w+x]=sum/cnt;
    }
  }
}
function filterSharpen(strength){
  const L=filterTargetLayer(); if(!L) return;
  pushUndo();
  const amt=strength!=null?strength:0.5;
  [L.pr,L.pg,L.pb].forEach(arr=>{
    const src=arr.slice();
    for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
      const i=y*W+x; if(L.pd[i]<=0.002) continue;
      const lap=src[i]*4-src[i-1]-src[i+1]-src[i-W]-src[i+W];
      arr[i]=clamp(src[i]+lap*amt*0.25,0,255);
    }
  });
  markFullDirty(); render(true); setStatus('Sharpen applied');
}
function filterWhiteToAlpha(){
  const L=filterTargetLayer(); if(!L) return;
  pushUndo();
  filterEachPixel(L,i=>{
    const lum=(L.pr[i]*0.299+L.pg[i]*0.587+L.pb[i]*0.114)/255;
    if(lum>0.92) L.pd[i]*=clamp((1-lum)/0.08,0,1);
  });
  markFullDirty(); render(true); setStatus('White to Alpha applied');
}
function filterBlackToAlpha(){
  const L=filterTargetLayer(); if(!L) return;
  pushUndo();
  filterEachPixel(L,i=>{
    const lum=(L.pr[i]*0.299+L.pg[i]*0.587+L.pb[i]*0.114)/255;
    if(lum<0.08) L.pd[i]*=clamp(lum/0.08,0,1);
  });
  markFullDirty(); render(true); setStatus('Black to Alpha applied');
}

/* ---- Levels ---- */
function buildLUT(inBlack,inWhite,gamma,outBlack,outWhite){
  const lut=new Uint8ClampedArray(256);
  const inRange=Math.max(1,inWhite-inBlack), outRange=outWhite-outBlack;
  for(let i=0;i<256;i++){
    let v=clamp((i-inBlack)/inRange,0,1);
    v=Math.pow(v,1/Math.max(0.01,gamma));
    lut[i]=clamp(outBlack+v*outRange,0,255);
  }
  return lut;
}
function filterLevels(){
  openFilterModal('Levels',
    `<div class="mrow"><label>Input Black</label><input type="range" data-fparam="ib" min="0" max="254" value="0"><output data-fout="ib">0</output></div>
     <div class="mrow"><label>Gamma</label><input type="range" data-fparam="gm" min="10" max="300" value="100"><output data-fout="gm">100</output></div>
     <div class="mrow"><label>Input White</label><input type="range" data-fparam="iw" min="1" max="255" value="255"><output data-fout="iw">255</output></div>
     <div class="mrow"><label>Output Black</label><input type="range" data-fparam="ob" min="0" max="254" value="0"><output data-fout="ob">0</output></div>
     <div class="mrow"><label>Output White</label><input type="range" data-fparam="ow" min="1" max="255" value="255"><output data-fout="ow">255</output></div>`,
    (L,p)=>{
      const ib=Math.min(p.ib??0,(p.iw??255)-1), iw=Math.max(p.iw??255,ib+1);
      const lut=buildLUT(ib,iw,(p.gm??100)/100,p.ob??0,p.ow??255);
      filterEachPixel(L,i=>{ L.pr[i]=lut[Math.round(clamp(L.pr[i],0,255))]; L.pg[i]=lut[Math.round(clamp(L.pg[i],0,255))]; L.pb[i]=lut[Math.round(clamp(L.pb[i],0,255))]; });
    });
}

/* ---- Curves (interactive canvas editor, RGB combined) ---- */
function filterCurves(){
  const L=filterTargetLayer(); if(!L) return;
  pushUndo();
  const pre={pr:L.pr.slice(),pg:L.pg.slice(),pb:L.pb.slice(),pd:L.pd.slice()};
  let points=[{x:0,y:0},{x:255,y:255}]; // control points, x sorted, 0-255 space
  openModal(`<h4>Curves</h4>
    <div class="miniCanvasWrap" style="width:220px;height:220px"><canvas id="curvesCanvas" width="220" height="220"></canvas></div>
    <p class="tinyNote">Click to add a point, drag to move it, double-click a point to remove it.</p>
    <div class="mbtns"><button class="qbtn" id="curvesReset">Reset</button><button class="qbtn" id="fltCancel">Cancel</button><button class="qbtn primary" id="fltApply">Apply</button></div>`);
  const cv=document.getElementById('curvesCanvas'), cg=cv.getContext('2d');
  function buildCurveLUT(){
    const pts=points.slice().sort((a,b)=>a.x-b.x);
    const lut=new Uint8ClampedArray(256);
    for(let x=0;x<256;x++){
      let a=pts[0], b=pts[pts.length-1];
      for(let k=0;k<pts.length-1;k++){ if(x>=pts[k].x && x<=pts[k+1].x){ a=pts[k]; b=pts[k+1]; break; } }
      const t = b.x===a.x ? 0 : (x-a.x)/(b.x-a.x);
      lut[x]=clamp(a.y+(b.y-a.y)*t,0,255);
    }
    return lut;
  }
  function drawCurve(){
    cg.clearRect(0,0,220,220);
    cg.fillStyle='#22242a'; cg.fillRect(0,0,220,220);
    cg.strokeStyle='#454b56'; cg.lineWidth=1;
    for(let g=0;g<=4;g++){ const p2=g*55; cg.beginPath(); cg.moveTo(p2,0); cg.lineTo(p2,220); cg.moveTo(0,p2); cg.lineTo(220,p2); cg.stroke(); }
    cg.strokeStyle='#5bb8ec'; cg.lineWidth=2; cg.beginPath();
    const lut=buildCurveLUT();
    for(let x=0;x<256;x+=2){ const px=x*220/255, py=220-(lut[x]*220/255); if(x===0) cg.moveTo(px,py); else cg.lineTo(px,py); }
    cg.stroke();
    cg.fillStyle='#5bb8ec';
    points.forEach(pt=>{ cg.beginPath(); cg.arc(pt.x*220/255,220-pt.y*220/255,4,0,Math.PI*2); cg.fill(); });
    return lut;
  }
  function recompute(){
    const lut=drawCurve();
    L.pr.set(pre.pr); L.pg.set(pre.pg); L.pb.set(pre.pb); L.pd.set(pre.pd);
    filterEachPixel(L,i=>{ L.pr[i]=lut[Math.round(clamp(L.pr[i],0,255))]; L.pg[i]=lut[Math.round(clamp(L.pg[i],0,255))]; L.pb[i]=lut[Math.round(clamp(L.pb[i],0,255))]; });
    markFullDirty(); render(true);
  }
  let dragIdx=-1;
  const toCurveSpace=(cx,cy)=>({x:clamp(cx*255/220,0,255),y:clamp(255-cy*255/220,0,255)});
  cv.addEventListener('pointerdown',e=>{
    const r=cv.getBoundingClientRect(); const cx=e.clientX-r.left, cy=e.clientY-r.top;
    const pos=toCurveSpace(cx,cy);
    let nearest=-1,best=12;
    points.forEach((pt,idx)=>{ const d=Math.hypot(pt.x-pos.x,pt.y-pos.y)/255*220; if(d<best){ best=d; nearest=idx; } });
    if(nearest>=0){ dragIdx=nearest; } else { points.push(pos); dragIdx=points.length-1; }
    recompute();
  });
  cv.addEventListener('pointermove',e=>{
    if(dragIdx<0) return;
    const r=cv.getBoundingClientRect(); const pos=toCurveSpace(e.clientX-r.left,e.clientY-r.top);
    points[dragIdx]=pos; recompute();
  });
  cv.addEventListener('pointerup',()=>dragIdx=-1);
  cv.addEventListener('dblclick',e=>{
    if(points.length<=2) return;
    const r=cv.getBoundingClientRect(); const cx=e.clientX-r.left, cy=e.clientY-r.top;
    const pos=toCurveSpace(cx,cy);
    let nearest=-1,best=12;
    points.forEach((pt,idx)=>{ const d=Math.hypot(pt.x-pos.x,pt.y-pos.y)/255*220; if(d<best){ best=d; nearest=idx; } });
    if(nearest>0 && nearest<points.length-1){ points.splice(nearest,1); recompute(); }
  });
  document.getElementById('curvesReset').onclick=()=>{ points=[{x:0,y:0},{x:255,y:255}]; recompute(); };
  document.getElementById('fltCancel').onclick=()=>{
    L.pr.set(pre.pr); L.pg.set(pre.pg); L.pb.set(pre.pb); L.pd.set(pre.pd);
    markFullDirty(); render(true); undoStack.pop(); updateUndoRedoUI(); closeModal();
  };
  document.getElementById('fltApply').onclick=()=>{ closeModal(); setStatus('Curves applied'); };
  recompute();
}

/* ---- Gradient Map (documented Rebelle 8.2 addition) ---- */
const GRADIENT_MAP_PRESETS={
  'Blue-Orange':['#0b1e3a','#e8823c'],
  'Sepia':['#241a12','#e8d4a0'],
  'Duotone Pink-Teal':['#1a2f3a','#e85d9c'],
  'Grayscale':['#000000','#ffffff'],
};
function filterGradientMap(){
  openFilterModal('Gradient Map',
    `<div class="mrow"><label>Preset</label><select id="gmPreset">${Object.keys(GRADIENT_MAP_PRESETS).map(k=>`<option value="${k}">${k}</option>`).join('')}</select></div>

// Rough Feather (PRO): rather than a uniform blur ring, perturb each boundary pixel's
// effective "distance to blur" with coherent noise before thresholding, so the resulting
// edge breaks into organic wisps/notches (like a torn paper edge) instead of a clean ring.
// Then apply a normal, smaller feather pass so the noisy edge itself isn't razor-sharp.
function roughFeatherMask(mask,radius,roughness,detailScale){
  const noisy=new Uint8Array(N);
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const i=y*W+x;
      // Sample the mask offset by a noise-driven vector scaled by roughness — this is what
      // turns a smooth boundary into an irregular, torn-looking one.
      const nx=(noise(x/detailScale,y/detailScale)-0.5)*2*roughness;
      const ny=(noise(x/detailScale+37.1,y/detailScale-19.4)-0.5)*2*roughness;
      const sx=clamp(Math.round(x+nx),0,W-1), sy=clamp(Math.round(y+ny),0,H-1);
      noisy[i]=mask[sy*W+sx];
    }
  }
  const f=new Float32Array(noisy); boxBlurPass(f,W,H,Math.max(1,Math.round(radius*0.5)));
  const out=new Uint8Array(N); for(let i=0;i<N;i++) out[i]=f[i]>0.5?1:0;
  return out;
}

function resampleImage(nw,nh){

    const C=newLayer(L.name);
    Object.assign(C,{visible:L.visible,locked:L.locked,opacity:L.opacity,blendMode:L.blendMode,lockAlpha:L.lockAlpha,maskMode:L.maskMode});
    ['pr','pg','pb','pd','wet','edge','height'].forEach(k=>{
      const c=document.createElement('canvas'); c.width=oldW;c.height=oldH;
      const g=c.getContext('2d'); const id=g.createImageData(oldW,oldH);
      const scaleVal = k==='pd'||k==='wet'||k==='edge'||k==='height' ? 255 : 1;
      for(let i=0;i<oldW*oldH;i++){ const v=L[k][i]*(scaleVal===255?255/2.4:1); id.data[i*4]=v;id.data[i*4+1]=v;id.data[i*4+2]=v;id.data[i*4+3]=255; }

      const g2=c2.getContext('2d'); g2.imageSmoothingEnabled=true; g2.drawImage(c,0,0,nw,nh);

    });
    return C;
  });

    if(k2==='i'){ filterInvert(); e.preventDefault(); return; }
  }
  if(ctrlLike && e.shiftKey){
    const k2=e.key.toLowerCase();
    if(k2==='f'){ filterColorFilter(); e.preventDefault(); return; }
    if(k2==='j'){ filterColorize(); e.preventDefault(); return; }
    if(k2==='u'){ filterDesaturate(); e.preventDefault(); return; }
  }
});

/* ======================= Project Save / Open (File menu) =======================
   Real Rebelle uses a proprietary binary .reb format we have no spec for, so this
   implements an equivalent JSON project file (saved with a .bearebel.json extension)
   that round-trips every layer's full pixel data losslessly via PNG-encoded canvases,
   plus paper, color, symmetry, tilt and layer/group metadata. */
function layerChannelToDataURL(arr,scale){
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d'); const id=g.createImageData(W,H);
  for(let i=0;i<N;i++){ const v=clamp(arr[i]*scale,0,255); id.data[i*4]=v;id.data[i*4+1]=v;id.data[i*4+2]=v;id.data[i*4+3]=255; }
  g.putImageData(id,0,0);
  return c.toDataURL('image/png');
}
function dataURLToChannel(dataURL,arr,invScale){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'); c.width=W;c.height=H;
      const g=c.getContext('2d'); g.drawImage(img,0,0,W,H);
      const id=g.getImageData(0,0,W,H).data;
      for(let i=0;i<N;i++) arr[i]=id[i*4]*invScale;
      resolve();
    };
    img.src=dataURL;
  });
}
function layerColorToDataURL(L){
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d'); const id=g.createImageData(W,H);
  for(let i=0;i<N;i++){ const o=i*4; id.data[o]=clamp(L.pr[i],0,255); id.data[o+1]=clamp(L.pg[i],0,255); id.data[o+2]=clamp(L.pb[i],0,255); id.data[o+3]=clamp(L.pd[i]/2.4*255,0,255); }
  g.putImageData(id,0,0);
  return c.toDataURL('image/png');
}
function dataURLToLayerColor(dataURL,L){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'); c.width=W;c.height=H;
      const g=c.getContext('2d'); g.drawImage(img,0,0,W,H);
      const id=g.getImageData(0,0,W,H).data;
      for(let i=0;i<N;i++){ const o=i*4; L.pr[i]=id[o]; L.pg[i]=id[o+1]; L.pb[i]=id[o+2]; L.pd[i]=id[o+3]/255*2.4; }
      resolve();
    };
    img.src=dataURL;
  });
}
async function serializeProject(){
  return {
    beARebelProject:1, W, H, paperKey, paperTint:paper.tint||null, paperTextureScale, deckledEdgesOn,
    color, symmetry:{...symmetry}, canvasTilt:{...canvasTilt}, perspectiveRuler:JSON.parse(JSON.stringify(perspectiveRuler)),
    V:{...V}, activeLayerIdx, layerGroups:JSON.parse(JSON.stringify(layerGroups)),
    layers: layers.map(L=>({
      name:L.name,visible:L.visible,locked:L.locked,lockAlpha:!!L.lockAlpha,opacity:L.opacity,blendMode:L.blendMode,
      useColorPigments:!!L.useColorPigments,impastoDepth:L.impastoDepth,impastoBlend:L.impastoBlend,
      reflectivity:L.reflectivity,groupId:L.groupId||null,maskMode:L.maskMode||'none',
      colorPNG:layerColorToDataURL(L),
      wetPNG:layerChannelToDataURL(L.wet,255/1.7),
      heightPNG:layerChannelToDataURL(L.height,255/3.2),
    })),
  };
}
async function deserializeProject(proj){
  if(!proj || !(proj.beARebelProject || proj.rebelleWebProject)) throw new Error('Not a recognized project file');
  W=proj.W; H=proj.H; N=W*H;
  canvas.width=W; canvas.height=H; image=ctx.createImageData(W,H);
  toothMap=new Float32Array(N); absorbMap=new Float32Array(N);
  reallocStrokeWetBuffers(); // the wet-on-wet "wetness at stroke start" buffers are canvas-sized too
  paperR=new Float32Array(N); paperG=new Float32Array(N); paperB=new Float32Array(N);
  paperKey=proj.paperKey||'cp'; paper=PAPERS[paperKey]||PAPERS.cp; if(proj.paperTint) paper.tint=proj.paperTint;
  paperTextureScale=proj.paperTextureScale||100; deckledEdgesOn=!!proj.deckledEdgesOn;
  buildPaper();
  color=proj.color||color; colorRGB=hexToRgb(color);
  if(proj.symmetry) Object.assign(symmetry,proj.symmetry);
  if(proj.canvasTilt) Object.assign(canvasTilt,proj.canvasTilt);
  if(proj.perspectiveRuler) Object.assign(perspectiveRuler,proj.perspectiveRuler);
  if(proj.V) Object.assign(V,proj.V);
  layerGroups=proj.layerGroups||[];
  const newLayers=[];
  for(const Ld of proj.layers){
    const L=newLayer(Ld.name);
    Object.assign(L,{visible:Ld.visible,locked:Ld.locked,lockAlpha:!!Ld.lockAlpha,opacity:Ld.opacity,blendMode:Ld.blendMode,
      useColorPigments:!!Ld.useColorPigments,impastoDepth:Ld.impastoDepth,impastoBlend:Ld.impastoBlend,
      reflectivity:Ld.reflectivity,groupId:Ld.groupId||null,maskMode:Ld.maskMode||'none'});
    await dataURLToLayerColor(Ld.colorPNG,L);
    await dataURLToChannel(Ld.wetPNG,L.wet,1.7/255);
    await dataURLToChannel(Ld.heightPNG,L.height,3.2/255);
    newLayers.push(L);
  }
  layers=newLayers.length?newLayers:[newLayer('Layer 1')];
  activeLayerIdx=Math.min(proj.activeLayerIdx||0,layers.length-1);
  selectionMask=null; selDraft=null; undoStack=[]; redoStack=[];
  recalcMaskLayersFlag(); buildLayersPanel(); buildLayerSettings(); buildVisualSettings(); buildPropertiesPanel();
  markFullDirty(); fitCanvas(); render(true); updateUndoRedoUI();
}

// Auto-Save is disabled entirely (see scheduleAutoSave above) — nothing writes or downloads
// automatically. This only recovers a snapshot left over from before Auto-Save was turned off.
async function recoverAutoSave(){
  const raw=await storageGet('autosaveRecovery',false);
  if(!raw){ setStatus('No auto-save recovery snapshot found'); return; }
  try{
    const wrap=JSON.parse(raw);
    if(!confirm('Recover auto-saved snapshot "'+(wrap.name||'Untitled')+'" from '+new Date(wrap.savedAt).toLocaleString()+'? This replaces the current canvas.')) return;
    pushUndo();
    await deserializeProject(wrap.proj);
    currentProjectName=wrap.name||currentProjectName;
    setStatus('Recovered auto-save from '+new Date(wrap.savedAt).toLocaleString());
  }catch(e){ setStatus('Auto-save recovery snapshot is unreadable'); }
}
function openProjectFromFile(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=async ()=>{
    const f=inp.files[0]; if(!f) return;
    try{
      const text=await f.text();
      const proj=JSON.parse(text);
      pushUndo();
      await deserializeProject(proj);
      currentProjectName=f.name.replace(/\.bearebel\.json$|\.rebweb\.json$|\.json$/i,'');
      setStatus('Opened "'+currentProjectName+'"');
    }catch(e){ setStatus('Could not open that file as a Be a Rebel project'); undoStack.pop(); updateUndoRedoUI(); }
  };

}

  layers = keepContent ? oldLayers.map(L=>{
    const nl=newLayer(L.name); nl.opacity=L.opacity; nl.visible=L.visible; nl.locked=L.locked; nl.blendMode=L.blendMode;
    const cw=Math.min(oldW,W), ch=Math.min(oldH,H);
    for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){ const si=y*oldW+x, di=y*W+x; nl.pr[di]=L.pr[si]; nl.pg[di]=L.pg[si]; nl.pb[di]=L.pb[si]; nl.pd[di]=L.pd[si]; nl.height[di]=L.height[si]; }
    return nl;
  }) : [newLayer('Layer 1')];
  activeLayerIdx=0; selectionMask=null; selDraft=null; selOverlayDirty=true; cleanupTransform();
  symmetry.cx=W/2; symmetry.cy=H/2;
  perspectiveRuler.vp1={x:W/2,y:H*0.3}; perspectiveRuler.vp2={x:W*0.15,y:H*0.3};
  buildLayersPanel(); buildLayerSettings(); buildPropertiesPanel();
  dirty=true; fitCanvas(); render(true);
  setStatus('Canvas resized to '+W+' × '+H);
}

/* ---- Quickbar ---- */
function buildQuickbar(){
  document.getElementById('quickbar').innerHTML=`
    <button class="qbtn" id="qbUndo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button class="qbtn" id="qbRedo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
    <div class="qsep"></div>
    <span class="toolName" id="qbToolName">Watercolor</span>
    <div class="qsep"></div>
    <input type="color" id="qbColor" class="swMini" value="${color}">
    <div class="qsep"></div>
    <label class="qslider" title="Pressure Sensitivity — how strongly pen pressure changes stroke size and opacity. 0% ignores pressure entirely, 50% is the calibrated default, 100% gives the widest range (hairline to full width).">Pressure
      <input type="range" id="qbPressure" min="0" max="100" step="1" value="${PREFS.pressureSensitivity}">
      <output id="qbPressureOut">${PREFS.pressureSensitivity}%</output></label>
    <div class="qsep"></div>
    <button class="qbtn ${showWetOverlay?'primary':''}" id="qbShowWet" title="Show Wet (H) — tint wet areas blue so you can see exactly where the canvas is still wet">💧 Wet</button>
    <button class="qbtn" id="qbDry">Dry Canvas</button>
    <button class="qbtn" id="qbClear">Clear Layer</button>
    <div class="qsep"></div>
    <label class="qbtn fileBtn" style="padding:5px 10px" title="Import a brush preset: Rebelle .json/.png, or Photoshop .abr">Import Brush…<input type="file" accept=".json,application/json,.png,image/png,.abr" id="qbImportBrush"></label>
    <label class="qbtn fileBtn" style="padding:5px 10px" title="Import a custom paper/canvas texture (.png/.jpg)">Import Paper…<input type="file" accept="image/*" id="qbImportPaper"></label>
    <div class="qsep"></div>
    <button class="qbtn primary" id="qbExport">Export PNG</button>`;
  document.getElementById('qbColor').oninput=e=>setColor(e.target.value);
  const qp=document.getElementById('qbPressure');
  if(qp) qp.oninput=e=>{
    PREFS.pressureSensitivity=+e.target.value;
    const out=document.getElementById('qbPressureOut'); if(out) out.textContent=PREFS.pressureSensitivity+'%';
    persistPrefs();
  };
  const qsw=document.getElementById('qbShowWet');
  if(qsw) qsw.onclick=()=>{ showWetOverlay=!showWetOverlay; markFullDirty(); render(true); buildLayersPanel(); buildQuickbar(); };
  document.getElementById('qbUndo').onclick=undo;
  document.getElementById('qbRedo').onclick=redo;
  document.getElementById('qbDry').onclick=dryCanvas;
  document.getElementById('qbClear').onclick=clearActiveLayer;
  document.getElementById('qbExport').onclick=exportPNG;
  // Same underlying importers as the Brushes/Layer Settings panels — this is just a second,
  // always-visible entry point for the two most-requested import actions, living in the
  // otherwise-empty space below the menu bar instead of being buried in a side panel.
  const qib=document.getElementById('qbImportBrush'); if(qib) qib.onchange=e=>{ if(e.target.files[0]) importBrushPresetFile(e.target.files[0]); };
  const qip=document.getElementById('qbImportPaper'); if(qip) qip.onchange=e=>{ if(e.target.files[0]) importPaperFile(e.target.files[0]); };
  updateUndoRedoUI();
}
function updateQuickbar(){
  const el=document.getElementById('qbToolName'); if(el) el.textContent=(brush&&brush.name)?brush.name:TOOLS_BY_ID[currentTool].name;
  const c=document.getElementById('qbColor'); if(c) c.value=color;
}

/* ---- Init ---- */
function rebuildAllUI(){
  buildToolsGrid(); buildPropertiesPanel(); buildBrushesPanel(); buildBrushCreator();
  buildVolumePresets(); buildNavigator(); buildColorPanel(); buildVisualSettings();
  buildLayerSettings(); buildLayersPanel(); buildTilt(); buildRulers(); buildRecord();
  buildAssets(); buildStencilLibrary(); buildMixingPalette(); buildReference(); buildPreview();
  buildQuickbar(); updateQuickbar();
}
function wireDropImport(elId,kind){
  const el=document.getElementById(elId); if(!el) return;
  el.addEventListener('dragover',e=>{ e.preventDefault(); el.style.outline='2px dashed #5bb8ec'; });
  el.addEventListener('dragleave',()=>{ el.style.outline=''; });
  el.addEventListener('drop',e=>{
    e.preventDefault(); el.style.outline='';
    const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(!f) return;
    if(kind==='brushcreator'){
      if(f.type==='application/json'||f.name.toLowerCase().endsWith('.json')) importBrushPresetFile(f);
      else if(f.name.toLowerCase().endsWith('.png')||f.type==='image/png') importBrushPresetFile(f);
      else if(f.type.startsWith('image/')) importShapeFile(f,false);
    } else if(kind==='paper'){
      if(f.type.startsWith('image/')) importPaperFile(f);
    }
  });
}
function init(){
  // The <canvas> element's width/height attributes in the HTML markup don't necessarily
  // match the engine's starting W/H — sync them before anything paints, otherwise the paper
  // buffer (sized W×H) only covers part of the actual on-screen canvas, leaving an unpainted
  // strip of the raw canvas background color visible as a "rectangle within the paper".
  canvas.width=W; canvas.height=H;
  layers=[newLayer('Layer 1')];
  buildPaper();
  symmetry.cx=W/2; symmetry.cy=H/2;
  perspectiveRuler.vp1={x:W/2,y:H*0.3}; perspectiveRuler.vp2={x:W*0.15,y:H*0.3};
  buildReconstructedBrushLibrary();
  setBrush(DEFAULT_BRUSH_FOR_TOOL['watercolor'],false);
  rebuildAllUI();
  initPanelChrome();
  wireZoomHud();
  fitCanvas();
  dirty=true; render(true);
  requestAnimationFrame(animate);
  // Import Brush Preset now lives in the quickbar (see buildQuickbar) instead of the
  // Brushes panel, to reduce left-panel clutter; drag-and-drop onto Brush Creator still works.
  wireDropImport('bcBody','brushcreator');
  wireDropImport('layerSettingsBody','paper');
  // Load any previously imported personal brushes/papers/preferences (persists across reloads in this environment)
  Promise.all([loadMyBrushes(),loadMyPapers(),loadPrefs(),loadMyColors()]).then(()=>{
    if(TOOLS_BY_ID[currentTool].kind==='paint') buildBrushesPanel();
    applyPrefsToUI(); applyCursorStyle(); scheduleAutoSave(); buildLayersPanel(); buildColorPanel();
  }).catch(()=>{});
}
init();
</script>
