      // Build a preview canvas from the decoded alpha so Brush Creator / the brush list can
      // show the REAL imported tip shape, not a guessed swoosh — this is genuine shape data.

      const prevG=prevC.getContext('2d'); const id=prevG.createImageData(br.w,br.h);

      // rejected preview swoosh), so it's legitimate to use directly as shapeTex here.
      return Object.assign(params,{key,maxSize:clamp(params.size*5,90,1500),
        shapeTex:{w:br.w,h:br.h,data:br.data},shapeTexURL:prevC.toDataURL(),shapeInvert:false,
        sizeBehavior:'pressure',opacityBehavior:'pressure-soft',tipTilt:0,brushForm:0,smudgeOnStroke:false,
        jitter:{enabled:false,mode:'stamp',hue:0,sat:0,bright:0},imported:true,importedFromAbr:true});
    });
    finishBrushPresetImport(built,targetTool,true);
    setStatus('Imported '+built.length+' brush'+(built.length>1?'es':'')+' from "'+file.name+
      '" (.abr v'+version+') — real tip shapes decoded, dynamics (water/flow/grain) still '+
      'approximated for this engine since Photoshop and Rebelle simulate paint differently.');
  }catch(e){
    setStatus('Could not parse that .abr file — it may use an ABR sub-version or brush type '+
      '(vector/parametric, dual-brush, pattern-based) this parser does not decode. Try File > '+
      'Import Assets in Photoshop\u2019s own Brush Creator equivalent workflow: export the tip as '+
      'a PNG shape via Photoshop\u2019s Export As, then use Brush Creator > Shape here instead.');
  }
}
/* Shared "which tool group should this land in?" prompt + apply step, used by
   both the JSON path and the PNG path so behavior stays consistent. */
function finishBrushPresetImport(list,targetTool,alreadyBuiltBrushes){
  const doImport=async(toTool)=>{
    let last=null;
    for(const item of list){
      const b=alreadyBuiltBrushes ? item : await deserializeBrush(item);
      addBrushToLibrary(b,toTool||item.tool||b.tool);
      last=b;
    }
    activeCategory='My Brushes'; buildBrushesPanel();
    if(last){ setTool(last.tool); setBrush(last.key,true); }
    if(!alreadyBuiltBrushes) setStatus('Imported '+list.length+' brush'+(list.length>1?'es':'')+' into "My Brushes"');
  };
  if(targetTool && targetTool!==currentTool && TOOLS_BY_ID[targetTool]){
    openModal(`<h4>Import Brush Preset</h4>
      <p class="tinyNote">This preset was made for <b>${TOOLS_BY_ID[targetTool].name}</b>. Where should it go?</p>
      <div class="mbtns">
        <button class="qbtn" id="impCurrentTool">Current Tool (${TOOLS_BY_ID[currentTool].name})</button>
        <button class="qbtn primary" id="impOwnTool">${TOOLS_BY_ID[targetTool].name}</button>
      </div>`);
    document.getElementById('impCurrentTool').onclick=()=>{closeModal(); doImport(currentTool);};
    document.getElementById('impOwnTool').onclick=()=>{closeModal(); doImport(targetTool);};
  } else { doImport(targetTool||currentTool); }
}
/* ---- PNG brush file decoding ----
   Rebelle's own brush files (and the free .png brush packs Escape Motions
   distributes) are PNGs that carry the brush's dynamics as JSON text packed
   into a standard PNG metadata chunk (tEXt/iTXt), the same mechanism many
   apps use to embed data in an otherwise perfectly normal, previewable
   image. We read that chunk directly (no need for a full PNG decoder — the
   PNG spec makes the chunk table trivial to walk), and:
     - If metadata IS found: rebuild the brush with its real recorded flow/
       water/pigment/grain/blend settings, so it behaves exactly as it was
       tuned to (fluidity, watercolor response, etc. all preserved).
     - If NO metadata is found (a bare shape swatch, which is how a lot of
       the "free brushes" collections ship): use the PNG pixels themselves
       as the brush's shape/coverage texture and build a new preset around
       them with full, sensible watercolor/oil/ink dynamics for whichever
       paint tool is currently active — so the brush immediately paints
       using this engine's real fluidity + water/pigment simulation instead
       of being rejected or imported as a dead flat stamp.
   Either way the result is a normal entry in "My Brushes" that works with
   every slider, paint mode, and the wet-diffusion simulation like any other
   brush here. */
function readPngTextChunks(buf){
  const out={};
  const view=new DataView(buf);
  if(view.byteLength<8) return out;
  const sig=[0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a];
  for(let i=0;i<8;i++) if(view.getUint8(i)!==sig[i]) return out;
  let off=8;
  const dec=new TextDecoder('latin1');
  while(off+8<=view.byteLength){
    const len=view.getUint32(off,false);
    const type=String.fromCharCode(view.getUint8(off+4),view.getUint8(off+5),view.getUint8(off+6),view.getUint8(off+7));
    const dataStart=off+8;
    if(dataStart+len>view.byteLength) break;
    if(type==='tEXt'){
      const bytes=new Uint8Array(buf,dataStart,len);
      const text=dec.decode(bytes);
      const nul=text.indexOf('\u0000');
      if(nul>=0) out[text.slice(0,nul)]=text.slice(nul+1);
    } else if(type==='iTXt'){
      try{
        const bytes=new Uint8Array(buf,dataStart,len);
        const text=dec.decode(bytes);
        const nul=text.indexOf('\u0000');
        if(nul>=0){
          const keyword=text.slice(0,nul);
          let rest=text.slice(nul+1);
          let skipped=0, idx=0;
          while(skipped<3 && idx<rest.length){ if(rest.charCodeAt(idx)===0) skipped++; idx++; }
          out[keyword]=rest.slice(idx);
        }
      }catch(e){}
    } else if(type==='IDAT'){ break; } // all metadata chunks precede IDAT in a valid PNG
    off=dataStart+len+4; // +4 for the chunk's CRC
  }
  return out;
}
function findEmbeddedBrushJSON(chunks){
  const candidates=['Description','Comment','rebelle','Rebelle','beARebelBrush','brush','Brush'];
  for(const key of candidates){
    const val=chunks[key]; if(!val) continue;
    const jsonStart=val.indexOf('{'); if(jsonStart<0) continue;
    try{
      const parsed=JSON.parse(val.slice(jsonStart));
      if(parsed && (parsed.name||parsed.tool||parsed.beARebelBrush)) return parsed;
    }catch(e){}
  }
  return null;
}
/* =========================================================================
   PNG BRUSH IMPORT — HONEST LIMITS
   Escape Motions confirms on their own support forum that Rebelle's brush
   AND paper files are PNGs with the real settings packed into proprietary,
   undocumented PNG metadata chunks — the visible pixels are only a preview
   swatch (the little curved "swoosh" shown in the Brushes panel), not the
   brush's actual tip/bristle shape. Escape Motions staff also confirm
   third-party/foreign brushes can NEVER be fully imported into Rebelle —
   not even their own official docs claim that; the documented workflow is
   always "extract Shape & Grain and rebuild in Brush Creator" (see
   https://www.escapemotions.com/community/forum/t/40496).
   That means analyzing the PNG's pixels (what the previous version of this
   importer did) is fundamentally the wrong approach for a metadata-less
   file: every Rebelle preview swoosh looks like a similar curved stroke
   regardless of the real brush behind it, which is exactly why three
   different brush files all produced near-identical results.
   The honest fix: fall back to the SAME filename-keyword heuristic that
   already successfully differentiates this app's ~90 built-in brushes
   (synthBrush()) — "leaf/mop/wash" reads as a soft wide glaze, "liner/rigger"
   reads as a thin hard line, "grunge/splat" reads as scattered/textured, an
   unrecognized name falls back to a neutral round brush — and tell the user
   plainly that fine-tuning in Brush Creator is expected, instead of
   pretending pixel-guessing produced Rebelle-accurate values. */
// Real substring-based shape detection from a brush's file/display name — unlike
// SHAPE_OVERRIDE (which only exact-matches a few literal built-in names like 'Liner' and
// silently falls through to the caller's default for anything else, e.g. 'Liner narrow'),
// this checks whether any of these words appear ANYWHERE in the name, case-insensitively,
// so real-world file names ('YT brush B1', 'Lines A02', 'Fine liner v2') still get mapped to
// a genuinely different footprint instead of always defaulting to round.
function shapeFromFileName(name){
  const n=name.toLowerCase();
  if(/liner|rigger|nib|line|fine|thin|hair|detail|script|calligrap/.test(n)) return 'liner';
  if(/flat|bright|chisel|comb|marker|square|edge/.test(n)) return 'flat';
  if(/filbert|blunt|oval/.test(n)) return 'filbert';
  if(/fan|feather/.test(n)) return 'fan';
  if(/mop|wash|cloud|glaze|bg|background|leaf|petal|foliage|sky|soft.?blend|blender/.test(n)) return 'mop';
  if(/knife|palette|smear/.test(n)) return 'knife';
  if(/splat|spatter|spray|drip|drop|splash|speckle|fleck/.test(n)) return 'splat';
  if(/grunge|shred|rough|texture|grain|rock|stone|coarse|dirty|distress|scratch/.test(n)) return 'grunge';
  // No keyword matched at all: rather than every unlabeled brush collapsing onto the same
  // 'round' footprint (which is what made 3 of 4 test brushes look identical), pick a real,
  // varied footprint deterministically from the name itself so different unlabeled files
  // still get visually distinct tip shapes, not just slightly different numbers on the same tip.
  const FALLBACK_SHAPES=['round','filbert','mop','flat'];
  return FALLBACK_SHAPES[Math.floor(hashString(name)*FALLBACK_SHAPES.length)%FALLBACK_SHAPES.length];
}
// Deterministic 0..1 hash of a string (same input always produces the same output) — used to
// nudge numeric brush parameters within a real range so two files sharing a shape category
// (or matching zero keywords at all) still come out numerically distinct, without relying on
// Math.random() (which would make re-importing the same file produce a different brush).
function hashString(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){ h=(h^str.charCodeAt(i))>>>0; h=Math.imul(h,16777619)>>>0; }
  return (h>>>0)/4294967295;
}
async function importBrushPresetFromPng(file){
  try{
    const buf=await file.arrayBuffer();
    const chunks=readPngTextChunks(buf);
    const meta=findEmbeddedBrushJSON(chunks);
    const blobURL=URL.createObjectURL(new Blob([buf],{type:'image/png'}));
    const img=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=blobURL; });
    const {ctx:g,w,h,dataURL}=imageToCanvas(img,512);
    URL.revokeObjectURL(blobURL);
    let b;
    if(meta){
      // Rebuild using the brush's own recorded settings (full fidelity: fluidity, water,
      // pigment, grain, blend, spacing, jitter — whatever the file carries).
      b=await deserializeBrush(Object.assign({},meta,{shapeTexture:meta.shapeTexture||dataURL}));
      setStatus('Imported "'+b.name+'" from PNG brush file — original dynamics restored');
    } else {
      // No embedded metadata (the normal case — see comment above): infer a real footprint
      // SHAPE from the filename via substring matching (shapeFromFileName — NOT the old
      // SHAPE_OVERRIDE table, which only exact-matches a handful of literal built-in brush
      // names like 'Liner' and silently ignored anything like 'Liner narrow'), then run the
      // same keyword-driven dynamics synthBrush() uses for the built-in library, seeded with
      // that real shape instead of a hardcoded 'round'. A deterministic hash of the filename
      // also nudges size/water/grain within a real range so two files that match NO keywords
      // (e.g. 'Round', 'Lines A02') still end up numerically distinct rather than bit-identical.
      const targetTool=(TOOLS_BY_ID[currentTool] && TOOLS_BY_ID[currentTool].kind==='paint') ? currentTool : 'watercolor';
      const engineForTool={oil:'oil',expressoil:'expressoil',watercolor:'watercolor',ink:'ink',pencil:'dryMedia',pastel:'dryMedia',marker:'marker',airbrush:'airbrush'}[targetTool]||'watercolor';
      const baseSizeByTool={oil:60,expressoil:60,watercolor:48,ink:36,pencil:16,pastel:44,marker:34,airbrush:66}[targetTool]||48;
      const niceName=file.name.replace(/\.[a-z0-9]+$/i,'').replace(/[_-]+/g,' ').trim()||'Imported Brush';
      const detectedShape=shapeFromFileName(niceName);
      const params=synthBrush(niceName,detectedShape,baseSizeByTool,targetTool,engineForTool,'My Brushes');
      params.shape=detectedShape; // synthBrush() only honors SHAPE_OVERRIDE for exact literal
                                   // matches, so force the real detected shape through directly.
      // Deterministic per-filename variation (not Math.random — same file always imports the
      // same way) so brushes with no keyword hits at all still differ numerically instead of
      // collapsing onto identical default numbers.
      const seed=hashString(niceName);
      const jitter=(lo,hi)=>lo+(hi-lo)*seed;
      params.size=Math.round(clamp(params.size*jitter(0.75,1.35),8,240));
      params.water=clamp(params.water*jitter(0.8,1.25),0.03,0.98);
      params.grain=clamp(params.grain*jitter(0.7,1.4),0.02,0.98);
      params.opacity=clamp(params.opacity*jitter(0.85,1.15),0.08,0.95);
      // IMPORTANT: do NOT feed the swatch's own pixels into the engine as a per-stroke
      // shape/coverage mask (shapeTex). That swatch is a generic curved "preview swoosh"
      // graphic (see the HONEST LIMITS comment above) — sampling it radially as if it were a
      // real centered brush-tip alpha mask made EVERY imported brush paint as the same solid,
      // hard-edged blob regardless of its detected footprint, because the swoosh's thick
      // painted stroke covers most of the sampled area at high opacity. That is exactly why
      // imported brushes looked nothing like the soft, tapered, grainy strokes a real brush
      // engine (or this app's own built-in brushes) produces. Leaving shapeTex unset makes
      // depositWet() fall back to the engine's real procedural elliptical falloff
      // (Math.pow(1-rr,1.4)) for whichever shape was detected — the same falloff every
      // built-in round/liner/mop/etc. brush already uses — so imported brushes get a real
      // soft/tapered edge instead of a hard blob. The swatch image is kept ONLY as a cosmetic
      // reference thumbnail (shapeTexURL) shown in Brush Creator, never as painting data.
      const key='custom_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
      b=Object.assign(params,{key,maxSize:clamp(params.size*5,90,1500),
        shapeTex:null,shapeTexURL:dataURL,shapeInvert:false,referenceSwatchOnly:true,
        sizeBehavior:'pressure',opacityBehavior:'pressure-soft',tipTilt:0,brushForm:0,smudgeOnStroke:false,
        jitter:{enabled:false,mode:'stamp',hue:0,sat:0,bright:0},imported:true,importedFromPng:true,
        needsShapeReview:true});
      setStatus('Imported "'+b.name+'" as a '+detectedShape+' brush (size '+params.size+'px, water '+
        params.water.toFixed(2)+', grain '+params.grain.toFixed(2)+') — Rebelle .png files store real '+
        'shape data in an undocumented format we cannot read, so this was inferred from the file name '+
        'and uses this engine\'s normal soft brush falloff (not the preview image as a hard stamp). '+
        'Open Brush Creator → Shape & Grain to fine-tune it further.');
    }
    finishBrushPresetImport([b],b.tool,true);
  }catch(e){
    setStatus('Could not read that PNG as a brush file — make sure it is a valid Rebelle brush image');
  }
}

/* ---- Custom Paper (PNG heightmap) import — mirrors Rebelle's "Import Canvas Texture" ---- */
async function addPaperFromDataURL(dataURL,name,existingKey,tint,persist){
  const img=await dataURLToImage(dataURL);
  const size=220;
  const scale=Math.min(size/img.width,size/img.height);
  const w=Math.max(8,Math.round(img.width*scale)), h=Math.max(8,Math.round(img.height*scale));
  const c=document.createElement('canvas'); c.width=w;c.height=h;
  const g=c.getContext('2d'); g.drawImage(img,0,0,w,h);
  const id=g.getImageData(0,0,w,h).data;
  const heightData=new Float32Array(w*h);
  let mn=1,mx=0;
  for(let i=0,p=0;i<w*h;i++,p+=4){ const lum=(id[p]*0.299+id[p+1]*0.587+id[p+2]*0.114)/255; heightData[i]=lum; if(lum<mn)mn=lum; if(lum>mx)mx=lum; }
  const range=Math.max(0.06,mx-mn);
  for(let i=0;i<heightData.length;i++) heightData[i]=clamp((heightData[i]-mn)/range,0,1);
  const key=existingKey||('custom_'+Date.now().toString(36));
  PAPERS[key]={name:name||'Custom Paper',isCustom:true,dataURL,heightMap:{w,h,data:heightData},
    tint:tint||null,tooth:0.6,absorb:0.42,grain:0.08,base:tint||'#f0e9d6'};
  if(persist!==false) persistMyPapers();
  return key;
}
async function importPaperFile(file){
  try{

    const {dataURL}=imageToCanvas(img,600);
    const name=prompt('Name this paper:',file.name.replace(/\.[a-z0-9]+$/i,''))||'Custom Paper';
    const key=await addPaperFromDataURL(dataURL,name);

}
function removeCustomPaper(key){

/* ---------- color helpers ---------- */
function currentColorRGB(){ return colorRGB; }
/* ---------- Color Jitter (Texture Brushes, PRO) ----------
   Randomizes hue/saturation/brightness per stamp, per stroke, or per bristle so marks
   don't all come out the exact same flat color — the same effect real Rebelle 8.3 uses to
   make brush strokes feel less uniformly "digital". Lives on the brush object as
   brush.jitter = {enabled, mode:'stamp'|'stroke'|'bristle', hue, sat, bright} (0-100 each). */
function jitterColor(baseRGB,amountObj,rnd){
  const hsl=rgbToHsl(baseRGB.r,baseRGB.g,baseRGB.b);
  const dh=(rnd()-0.5)*2*(amountObj.hue/100)*180;
  const ds=(rnd()-0.5)*2*(amountObj.sat/100);
  const dl=(rnd()-0.5)*2*(amountObj.bright/100)*0.6;
  const rgb=hslToRgb(hsl.h+dh, clamp(hsl.s+ds,0,1), clamp(hsl.l+dl,0,1));
  return {r:clamp(rgb.r,0,255),g:clamp(rgb.g,0,255),b:clamp(rgb.b,0,255)};
}
// Per-stroke jitter is rolled once at stroke start (see paint()/canvas pointerdown) and
// cached on strokeState so every stamp in that stroke shares the same randomized color.
function getJitteredColor(b,forceReroll){
  const base=currentColorRGB();
  if(!b.jitter || !b.jitter.enabled) return base;
  if(b.jitter.mode==='stroke'){
    if(!strokeState.jitteredColor || forceReroll){
      strokeState.jitteredColor=jitterColor(base,b.jitter,Math.random);
    }
    return strokeState.jitteredColor;
  }
  // 'stamp' mode (and the base color for 'bristle' mode, refined further per-bristle below)
  return jitterColor(base,b.jitter,Math.random);
}
function setColor(hex,skipRecent){
  color=hex; colorRGB=hexToRgb(hex);
  if(!skipRecent){
    recentColors=recentColors.filter(c=>c.toLowerCase()!==hex.toLowerCase());
    recentColors.unshift(hex); if(recentColors.length>12) recentColors.pop();
    buildRecentSwatches();
  }
  updateColorUI();
}

/* ---------- footprint / bristles ---------- */
function footprint(shape,size,angle,speed,brushObj){
  speed=speed||0;
  // Tip Tilt: when a brush has this set, blend in whatever real stylus tilt hardware is
  // reporting RIGHT NOW (livePenTilt, updated per pointer event) — a pen laid nearly flat
  // (tiltAmount near 1) widens the mark toward a flat/shading footprint, a pen held near-
  // vertical (tiltAmount near 0) keeps it narrow, matching the manual's described behavior
  // for graphite Tip Tilt brushes. brushObj.tipTilt still acts as the brush's own base
  // sensitivity/rotation offset for tools or input devices with no real tilt signal (mouse,
  // or a pen that doesn't report tiltX/tiltY) so those brushes still behave reasonably.
  const tiltSensitivity=brushObj?(brushObj.tipTilt||0)/100:0;
  const liveTiltWiden = tiltSensitivity>0.01 ? livePenTilt.amount*tiltSensitivity : 0;
  const tilt=tiltSensitivity*0.35;
  const form=brushObj?(brushObj.brushForm||0)/100:0;
  // Rotation mode (Brush Creator > Stroke > Rotation): real Rebelle brushes can either
  // follow the stroke's travel direction (the default this engine always did before, and
  // still the base for 'trajectory'/unset), or ignore stroke direction entirely and stay at
  // a fixed absolute angle ("None" — used by e.g. Bullet Marker, a round-ish tip where
  // rotation shouldn't track the stroke at all). Shape Angle is then always added ON TOP of
  // that base as a constant offset (not a replacement for it) — this is what lets Chisel
  // Calligraphic combine "Rotation: Follow Trajectory" with its own 20° Shape Angle tilt,
  // matching the source spec, while Chisel (plain) just uses Follow Trajectory with
  // Shape Angle 0. 'fixed' mode is Shape Angle acting as the ENTIRE angle with no trajectory
  // contribution at all (for a brush that should always lay down the exact same angled mark
  // no matter which way the stroke travels).
  const shapeAngleRad=(brushObj?(brushObj.shapeAngle||0):0)*Math.PI/180;
  let baseAngle=angle+shapeAngleRad;
  if(brushObj){
    if(brushObj.rotationMode==='fixed') baseAngle=shapeAngleRad;
    else if(brushObj.rotationMode==='none') baseAngle=shapeAngleRad;
  }
  // Angle Jitter / Random Start / Random Stamp (Brush Creator > Stroke): Random Stamp gives
  // EVERY dab a fresh random rotation; Random Start randomizes only the very first dab of a
  // stroke (subsequent dabs behave normally); Angle Jitter adds a small bounded random
  // wobble around whatever angle the brush would otherwise use. strokeState.stampCount is
  // incremented once per dab in paint(), so `===1` reliably identifies "first dab of this
  // stroke" for Random Start without needing to thread an extra parameter through every
  // deposit function that calls footprint().
  let randomKick=0;
  if(brushObj && brushObj.randomStamp) randomKick=Math.random()*Math.PI*2;
  else if(brushObj && brushObj.randomStart && strokeState.stampCount===1) randomKick=Math.random()*Math.PI*2;
  const angleJitterRad = brushObj && brushObj.angleJitterDeg ? (Math.random()-0.5)*2*(brushObj.angleJitterDeg*Math.PI/180) : 0;
  let rx=size*.5, ry=size*.5, rot=baseAngle+tilt+angleJitterRad+randomKick+(liveTiltWiden>0?livePenTilt.angleRad*tiltSensitivity*0.3:0);
  switch(shape){
    // The `-.20*speed` term elongates a round mark along the stroke as it is dragged faster,
    // which is right for a physical brush tip flexing under load — but WRONG for an airbrush,
    // whose spray cone is radially symmetric and does not deform with hand speed at all. Left
    // unexempted it squashed every airbrush dab by up to 40% vertically, turning what should be
    // round sprayed clouds into ovals that lean with stroke direction (clearly visible when
    // comparing against the round marks on the sample sheet). Airbrush therefore keeps a
    // circular footprint regardless of speed; every other tool keeps the original behaviour.
    case 'round': {
      const speedSquash = (brushObj && brushObj.engine==='airbrush') ? 0 : .20*speed;
      ry=size*(.5-speedSquash)*(1-form*.35)*(1-liveTiltWiden*0.6);
      break;
    }
    case 'mop': case 'wash': rx=size*.62; ry=size*.42; break;
    case 'flat': rx=size*.66; ry=size*.16*(1+form*.6); break;
    case 'filbert': rx=size*.52; ry=size*.30; break;
    case 'fan': rx=size*.85; ry=size*.10; break;

// neighbors as a stroke progresses); a random offset means which pixels get skipped differs

  // somehow bypass setBrush()'s defaulting.
  const falloffExp = b.edgeSoftness!=null ? lerp(2.6,0.5,clamp(b.edgeSoftness,0,100)/100) : 1.4;
  forEachInDab(x,y,fp.rx,fp.ry,fp.rot,stride,(px,py,i,rr,nx,ny)=>{
    if(!inSelection(px,py)) return;
    const st=stencilAlpha(px,py); if(st<=0.02) return;
    const fall=b.shapeTex ? sampleTexShape(b.shapeTex,nx,ny) : Math.pow(1-rr,falloffExp);
    if(fall<=0.006) return;
    let tooth=b.grainTex ? lerp(toothMap[i],sampleTexTiled(b.grainTex,px,py,grainScale),0.7) : toothMap[i];
    if(b.grainSmoothing) tooth=lerp(tooth,0.5,0.35);
    const turb=(bias.soft)?1:0.75+0.5*noise(px*0.02+seed,py*0.02-seed);
    let amount=amountBase*b.flow*fall*turb*st*(1-grainAmt*0.6+grainAmt*tooth)*bias.pigmentMul;
    if(amount<=0.0008) return;
    const old=L.pd[i];
    if(L.lockAlpha && old<=0.002) return; // Lock Transparency: never paint onto empty pixels
    // BUG FIX: grain previously only changed how FAST a pixel's density approached the
    // plateau, not the plateau itself — so after enough overlapping dabs (normal for any
    // real stroke of more than a few pixels long), every pixel converged to the SAME final
    // density regardless of grain, permanently erasing the texture pattern and leaving a
    // flat, solid-colored blob. Real dry-media grain works because paper tooth physically
    // holds less pigment in the valleys and more on the peaks — that's a ceiling difference,
    // not just a speed difference. Scaling the plateau itself by tooth (for grainy brushes)
    // means the texture pattern survives indefinitely, however long the stroke/however many
    // times it's re-stroked, instead of washing out to solid coverage.
    const grainCeilingMul = grainAmt>0.02 ? lerp(1-grainAmt*0.55, 1, tooth) : 1;
    // BUG FIX (found via actual browser testing, not just code review): a brush's own
    // opacity setting only scaled amountBase (the per-dab speed), not the pigmentApproach
    // plateau itself — so a deliberately light/low-opacity wash brush (e.g. opacity 0.3)
    // still had pd climb toward the SAME ~1.5 ceiling as a full-opacity brush once a stroke
    // contained enough overlapping dabs, then got re-multiplied by opacity at render time
    // (pd*opacity), landing well above the intended visual lightness — confirmed directly:
    // a brush with opacity=0.3 measured pd=1.32 after one normal-length stroke, rendering
    // at alpha~0.39 instead of staying near the intended ~0.3 range. Scaling the ceiling by
    // opacity (in addition to grain) means a light wash brush's pixels approach a genuinely
    // low plateau and stay light no matter how long the stroke or how many dabs overlap it.
    const opacityCeilingMul = clamp(0.35+b.opacity*0.9,0.35,1.25);
    const preWet=L.wet[i]; // wetness already on the paper BEFORE this stamp — drives instant bloom below
    // WET DILUTION — the missing piece that made wet-on-wet look like nothing was happening.
    // Paint laid into a standing water film cannot build a dense mark: the pigment immediately
    // disperses through the water instead of staying where the brush put it, so the SAME amount
    // of pigment ends up covering a much larger area at a much lower density. Without this, a
    // stroke onto soaking paper still drove pd up to ~2.2 (well past the point where a pixel
    // renders fully opaque), so it read as an identical hard-edged solid bar to the same stroke
    // on dry paper — verified side by side before adding this. Scaling the density ceiling down
    // with existing wetness is what turns that bar into a soft, translucent, spreading bloom,
    // and it is why wet-on-wet marks are characteristically paler than dry-brush marks.
    // Threshold matters here. `preWet` includes wetness laid down by EARLIER DABS OF THIS SAME
    // STROKE (a loaded watercolour brush wets the paper as it goes), so diluting from zero
    // upward made an ordinary stroke on dry paper progressively wash itself out — measured at
    // peak density 0.4 instead of ~1.7, i.e. every watercolour stroke suddenly turned pale.
    // Only water BEYOND what a loaded brush deposits by itself counts as standing water, so
    // dilution starts at 0.5 and reaches full strength at 1.55 (near the 1.7 the Water tool
    // saturates at). A brush's own trail therefore dilutes only mildly, while genuinely
    // pre-wetted paper dilutes strongly.
    if(strokeWetStamp[i]!==strokeWetId){ strokeWetStamp[i]=strokeWetId; strokeWetAtStart[i]=preWet; }
    const standingWet=strokeWetAtStart[i];
    const wetDiluteMul = standingWet>0.06 ? lerp(1,0.45,clamp(standingWet/1.25,0,1)) : 1;
    const ceilMul = grainCeilingMul*opacityCeilingMul*wetDiluteMul;
    // Pixels with ~zero prior coverage have no meaningful stored color (buffers default to
    // black). Treat such pixels as if their "old color" were the new paint color itself,
    // so we never fade in from black on a fresh/blank area.
    const hadColor=old>0.01;
    const oR=hadColor?L.pr[i]:col.r, oG=hadColor?L.pg[i]:col.g, oB=hadColor?L.pb[i]:col.b;
    if(mode==='paint' && bias.subtractive){
      const a=clamp(amount*1.8,0,1);
      L.pr[i]=lerp(oR,col.r,a); L.pg[i]=lerp(oG,col.g,a); L.pb[i]=lerp(oB,col.b,a);
      L.pd[i]=clamp(old+pigmentApproachIncrement(old,amount,1.5*ceilMul),0,2.4);
    } else if(bias.flatCap){
      if(amount>old*0.4){ L.pr[i]=col.r; L.pg[i]=col.g; L.pb[i]=col.b; L.pd[i]=clamp(old+pigmentApproachIncrement(old,amount,2.2*ceilMul),0,2.2); }
    } else if(bias.subtractive && b.mixingMode==='opaque'){
      // Opaque (gouache-like): dense, flat color coverage rather than glazing through.
      const a=clamp(amount*2.2,0,1);
      L.pr[i]=lerp(oR,col.r,a); L.pg[i]=lerp(oG,col.g,a); L.pb[i]=lerp(oB,col.b,a);
      L.pd[i]=clamp(old+pigmentApproachIncrement(old,amount,2.4*ceilMul),0,2.4);
    } else if(bias.subtractive && b.mixingMode==='semitransparent'){
      // Midpoint: subtractive glazing blended with a direct opacity-driven mix.
      const total=old+pigmentApproachIncrement(old,amount,1.8*ceilMul)+1e-6;
      const subR=255-((255-oR)*old+(255-col.r)*amount)/total, subG=255-((255-oG)*old+(255-col.g)*amount)/total, subB=255-((255-oB)*old+(255-col.b)*amount)/total;
      const a=clamp(amount*1.5,0,1);
      const opR=lerp(oR,col.r,a), opG=lerp(oG,col.g,a), opB=lerp(oB,col.b,a);
      const t=clamp(b.opacity,0,1);
      L.pr[i]=lerp(subR,opR,t); L.pg[i]=lerp(subG,opG,t); L.pb[i]=lerp(subB,opB,t);
      L.pd[i]=clamp(total,0,2.4);
    } else if(bias.subtractive && pigmentMixing){
      // Real Pigment Color Mixing: mix in approximate RYB pigment space instead of the RGB
      // complement, so e.g. yellow+blue trends toward green like actual paint, not gray-brown.
      const total=old+pigmentApproachIncrement(old,amount,1.5*ceilMul)+1e-6, t=clamp((total-old)/total,0,1);
      const mixed=mixNaturalRGB(oR,oG,oB,colRyb,t);
      L.pr[i]=mixed.r; L.pg[i]=mixed.g; L.pb[i]=mixed.b;
      L.pd[i]=clamp(total,0,2.4);
    } else if(bias.subtractive){
      const total=old+pigmentApproachIncrement(old,amount,1.5*ceilMul)+1e-6;
      const t=(total-old)/total;
      L.pr[i]=255-((255-oR)*(1-t)+(255-col.r)*t);
      L.pg[i]=255-((255-oG)*(1-t)+(255-col.g)*t);
      L.pb[i]=255-((255-oB)*(1-t)+(255-col.b)*t);
      L.pd[i]=clamp(total,0,2.4);
    } else {
      const a=clamp(amount,0,1);
      L.pr[i]=oR*(1-a)+col.r*a; L.pg[i]=oG*(1-a)+col.g*a; L.pb[i]=oB*(1-a)+col.b*a;
      L.pd[i]=clamp(old+pigmentApproachIncrement(old,amount,1.5*ceilMul),0,2.4);
    }
    if(bias.waterMul>0){
      const addW=b.water*bias.waterMul*fall*(1-absorbMap[i]*(V.absorbency/10)*0.5);
      L.wet[i]=clamp(L.wet[i]+addW*(1+(V.rewet/10)*0.4*old),0,1.6);
      growBounds(L,px,py);
      // Wet-in-wet bloom: if the paper was ALREADY wet before this stamp (e.g. the user
      // pre-wet the canvas with the Water tool), immediately push some fresh pigment one
      // ring outward so the stroke visibly "blooms" right away instead of only spreading
      // gradually over the next few animation frames. Strength scales with how wet the
      // paper already was and with Re-wet in Visual Settings.
      // Wet-on-wet dispersal at deposit time. Previously this pushed a fixed fraction into
      // only the 4 orthogonal neighbours, which produced a barely-perceptible one-pixel halo.
      // Now it also feeds the 4 diagonals (at reduced weight, since they are further away),
      // and the strength scales with how wet the paper already was — so a stroke onto a
      // properly wet wash immediately spills outward in all directions the way real paint
      // does when it touches standing water, rather than waiting several frames for the
      // background simulation to slowly carry it.
      if(preWet>0.06 && bias.subtractive){
        const wn=clamp(preWet/1.2,0,1);
        const bloom=clamp(preWet*0.8*(0.4+V.rewet/10),0,1.3)*amount;
        if(bloom>0.0006){
          for(let k=0;k<8;k++){
            const nx2=px+WOW_DX[k], ny2=py+WOW_DY[k];
            if(nx2<0||ny2<0||nx2>=W||ny2>=H) continue;
            if(!inSelection(nx2,ny2)) continue;
            const share=k<4?1:0.55; // diagonals are ~1.41x further away, so they receive less
            const j=ny2*W+nx2;
            // The dispersed pigment must respect the same wet-diluted density ceiling the
            // centre of the dab does. This previously added to the neighbour unconditionally,
            // capped only by the global 2.4 maximum — so although each individual dab stayed
            // pale, ~80 overlapping dabs along a single stroke each dumped more pigment into
            // the same neighbours and drove density to ~1.75 regardless of how wet the paper
            // was, which is what defeated the dilution above and kept wet-on-wet strokes
            // looking like solid dry-paper bars. Approaching a shared ceiling instead means
            // the mark spreads outward without ever building up dense.
            const bloomCap=1.5*ceilMul;
            const room=bloomCap-L.pd[j];
            if(room<=0.0005) continue;
            const dep=Math.min(bloom*share,room*0.55);
            const jOld=L.pd[j], jTot=jOld+dep+1e-6;
            L.pr[j]=(L.pr[j]*jOld+col.r*dep)/jTot; L.pg[j]=(L.pg[j]*jOld+col.g*dep)/jTot; L.pb[j]=(L.pb[j]*jOld+col.b*dep)/jTot;
            L.pd[j]=clamp(jTot,0,2.4);
            L.wet[j]=clamp(L.wet[j]+preWet*0.3*share,0,1.6);
            growBounds(L,nx2,ny2);
          }
          // Paint that has just dispersed outward is no longer all sitting under the brush:
          // remove a wetness-scaled share from the centre so the stroke reads as diluted and
          // soft-edged on wet paper instead of a hard opaque core with a halo bolted around it.
          L.pd[i]=Math.max(0,L.pd[i]-bloom*wn*1.1);
        }
      }
    }
    L.edge[i]=clamp(L.edge[i]+amount*(1-fall)*0.05,0,1);
  });
  // Smudge Density previously had NO numeric effect — brush.smudgeOnStroke only ever
  // contributed a fixed 0.10 blend regardless of what Density value was stored, so setting
  // e.g. 50 vs. 90 (as several reconstructed watercolor brushes specify) did nothing. Now
  // scales the actual per-dab smear amount so higher Density brushes genuinely blend/soften
  // their own edges more between adjacent dabs, matching Rebelle's documented behavior of
  // Smudge Density controlling how strongly a brush drags/mixes color as it strokes.
  const smudgeDensityMul = b.smudgeOnStroke ? clamp((b.smudgeDensity!=null?b.smudgeDensity:80)/100,0,1) : 0;
  const extraBlend = mode==='paintblend' ? (1-pressure)*0.22 : (b.smudgeOnStroke? 0.06+smudgeDensityMul*0.16 : 0);
  if(extraBlend>0 && strokeState.lastStamp){
    smearAt(L,x,y,strokeState.lastStamp.x,strokeState.lastStamp.y,pressure,b,extraBlend);
  }
  strokeState.lastStamp={x,y};
  L.dirty=true; markRenderDirty(x,y,Math.max(fp.rx,fp.ry)+6);
}

/* ---------- deposit: oil / express oil (multi-bristle + impasto) ---------- */
function depositOil(L,x,y,pressure,angle,speed,b){
  if(!L||L.locked) return;
  if(!strokeState.bristles) strokeState.bristles=makeBristles(b);
  const sizeK=evalCurve(b.sizeBehavior||'pressure',pressure,speed,b.sizeCurve);
  // Size Jitter: same real per-dab random size multiplier depositWet() has, now also honored
  // by the oil engine (previously silently ignored for every Oil/Acrylic/Express Oil brush,
  // even though buildBrushesFromReconSpecs already set brush.sizeJitter for every tool).
  const sizeJitterMul = b.sizeJitter ? 1+(Math.random()-0.5)*2*clamp(b.sizeJitter/100,0,1) : 1;
  const spf=sizePressureFloor(); // sensitivity-driven; 0.35 at the default 50 (see depositWet)
  const size=clamp(b.size*(spf+(1.2-spf)*sizeK)*sizeJitterMul,2,b.maxSize||b.size*4);
  const lengthNorm=(b.length!=null?b.length:100)/100;
  const loadFactor=lengthNorm>=0.99?1:clamp(1-strokeState.dist/(size*(6+lengthNorm*120)+1),0.04,1);
  const baseCol=currentColorRGB();
  const jitterActive=b.jitter && b.jitter.enabled;
  const strokeCol=jitterActive && b.jitter.mode==='stroke' ? getJitteredColor(b) : baseCol;
  const stampCol=jitterActive && b.jitter.mode==='stamp' ? getJitteredColor(b) : strokeCol;
  const oili=clamp(b.oiliness/100,0,1);
  const mode=b.paintMode||'paintmix';
  // Loading Jitter: Oil & Acrylic's real Brush Creator field name for what depositWet calls
  // Opacity Jitter — same real per-dab random multiplier mechanism, reusing b.opacityJitter
  // as the value since this engine has no separate "opacity" volume of its own (Loading IS
  // its primary paint-volume control, matching the source spec's own "Loading Jitter" name).
  const loadingJitterMul = b.opacityJitter ? clamp(1+(Math.random()-0.5)*2*clamp(b.opacityJitter/100,0,1),0.05,2) : 1;
  // BUG FIX: Pressure -> Loading had NO effect whatsoever on oil/acrylic brushes. This engine
  // evaluated the size curve (sizeK, above) but never evaluated the opacity/loading curve at
  // all, so amountBase was built purely from static brush fields — meaning pressing harder
  // with ANY Oil & Acrylic or Express Oil brush changed the stroke's WIDTH but never how much
  // paint it actually laid down. That is a large part of why every oil brush read as flat and
  // pressure-insensitive regardless of its settings. depositWet() has always applied its
  // equivalent curve (opacK); this brings the oil engine in line with it. Oil & Acrylic's real
  // Brush Creator calls this control "Pressure -> Loading" rather than "Pressure -> Opacity",
  // since Loading (not opacity) is this medium's paint-volume property — same curve field,
  // medium-appropriate name.
  const loadK=evalCurve(b.opacityBehavior||'pressure-soft',pressure,speed,b.opacityCurve);
  const cos=Math.cos(angle), sin=Math.sin(angle);
  strokeState.bristles.forEach(br=>{
    // Per-bristle jitter: each bristle gets its own stable-seeded color offset so the same
    // bristle stays a consistent (slightly different) shade for the whole stroke, rather
    // than flickering randomly stamp-to-stamp.
    const col = (jitterActive && b.jitter.mode==='bristle')
      ? jitterColor(baseCol,b.jitter,seededRandom(Math.round(br.jitterSeed*1e6)))
      : stampCol;
    const bx=x+(br.ox*cos-br.oy*sin)*size/60;
    const by=y+(br.ox*sin+br.oy*cos)*size/60;
    const r=Math.max(1.2,size*br.r*0.5);
    const amountBase=(b.loading!=null?b.loading/100:1)*b.opacity*b.flow*loadK*loadFactor*loadingJitterMul*(1-br.wear*0.35);
    forEachInDab(bx,by,r,r*(b.shape==='knife'?0.55:1),angle,1,(px,py,i,rr)=>{
      if(!inSelection(px,py)) return;
      const st=stencilAlpha(px,py); if(st<=0.02) return;
      const fall=1-rr;
      // BUG FIX: this used to always read the PAPER's own tooth texture and completely
      // ignore b.grainTex — so any oil/bristle brush built with a custom grain texture
      // (chisel streaks, coarse sponge, etc.) painted with that texture totally invisible,
      // contributing to every oil-engine brush looking like a flat, textureless blob
      // regardless of its grain setting. Same fix as depositWet(): blend in the brush's own
      // grain texture (tiled to world space) when it has one, exactly like the wet-media path.
      // Grain Smoothing: same real mechanism depositWet() has (a larger sample tile scale +
      // pulling the tooth value toward its own mean), now also honored here — previously
      // silently ignored for the oil engine even though it's a real, meaningful field.
      const grainScale2 = Math.max(4,size*0.5) * (b.grainSmoothing ? 1.7 : 1);
      let tooth=b.grainTex ? lerp(toothMap[i],sampleTexTiled(b.grainTex,px,py,grainScale2),0.7) : toothMap[i];
      if(b.grainSmoothing) tooth=lerp(tooth,0.5,0.35);
      const grainAmt2=b.grain*(0.4+V.textureInfluence/10);
      // Oiliness now drives COVERAGE, not just colour mixing. Physically, dry paint only
      // catches on the paper's raised tooth and skips the valleys, while wet/oily paint floods
      // the valleys and covers evenly. Before this, tooth influence was pinned at a fixed
      // `0.7+0.3*tooth` for EVERY oil brush — only 30% weight, identical for a bone-dry brush
      // and a soaking-oily one — so Oiliness only ever changed how colours blended and had no
      // effect whatsoever on whether a stroke looked dry or wet. Measured consequence: all 15
      // Round/Bristle/Flat/Filbert brushes rendered as the same solid black band regardless of
      // their Oiliness (5 vs 90), which is precisely the "every oil brush looks identical"
      // problem. Now a bone-dry brush (oiliness 5) weights tooth at ~0.87, so paper valleys
      // receive only ~13% of the paint and genuinely break the stroke up, while an oily brush
      // (oiliness 90) weights it at ~0.36 and lays down near-uniform coverage. This makes the
      // Dry <-> Oily axis — the primary axis of the source's own control matrix — actually
      // visible, which is the whole point of Oiliness existing as a separate control.
      const toothInfluence = 0.3+0.6*(1-oili);
      let amount=amountBase*fall*((1-toothInfluence)+toothInfluence*tooth)*st;
      if(amount<=0.0006) return;
      if(L.lockAlpha && L.pd[i]<=0.002) return;
      // Same "grain sets a ceiling, not just a speed" fix as depositWet(): without this, the
      // oil engine's per-dab additive buildup (L.pd[i]+amount*0.5) still eventually washes
      // every pixel to the same coverage regardless of tooth once a stroke is passed over
      // enough times, which is what erased grain texture in oils just as it did in wet media.
      // The grain ceiling has to bite considerably harder in the oil engine than the 0.55
      // factor used before. Oil strokes accumulate paint fast (many heavily overlapping
      // bristle dabs per stroke), and the pd ceiling here is 2.6 — so at 0.55 even a
      // grain:0.8 "Rough Dry" brush still had a low-tooth ceiling of ~1.56, far above the
      // point where a pixel already renders fully opaque. Measured result: every Round /
      // Flat / Bristle / Filbert brush filled in at 99-100% coverage with average pd 1.7-2.4
      // regardless of its grain value, i.e. dry brushes were indistinguishable from oily ones
      // and grain had no visible effect at all. At 0.95 the low-tooth ceiling for a high-grain
      // brush lands near or below 1.0, so the paper's untouched valleys genuinely show through
      // as dry-brush breakup, while low-grain brushes (Round Hard at grain 0.2 -> ceiling
      // ~2.16) still lay down the solid opaque paint they are supposed to.
      const grainCeilingMul2 = grainAmt2>0.02 ? lerp(1-grainAmt2*0.95, 1, tooth) : 1;
      const mixT = mode==='paint' ? Math.min(0.94,fall*0.92) : clamp(0.22+0.65*oili,0,0.95)*fall;
      const hadColor=L.pd[i]>0.01;
      const oR=hadColor?L.pr[i]:col.r, oG=hadColor?L.pg[i]:col.g, oB=hadColor?L.pb[i]:col.b;
      L.pr[i]=lerp(oR,col.r,mixT); L.pg[i]=lerp(oG,col.g,mixT); L.pb[i]=lerp(oB,col.b,mixT);
      const pdCeiling=2.6*grainCeilingMul2;
      L.pd[i]=clamp(Math.min(L.pd[i]+amount*0.5,pdCeiling),0,2.6);
      L.height[i]=clamp(L.height[i]+amount*b.pigment*(V.impastoDepth/10)*(b.shape==='knife'?1.7:1)*fall,0,3.2);
    });
  });
  if(mode==='paintblend' && strokeState.lastStamp){
    smearAt(L,x,y,strokeState.lastStamp.x,strokeState.lastStamp.y,pressure,b,(1-pressure)*0.18);
  }
  strokeState.lastStamp={x,y};
  L.dirty=true; markRenderDirty(x,y,size*0.75+10);
}

/* ---------- water / dry / eraser tools ---------- */
function toolWater(L,x,y,pressure,speed,b){
  if(!L||L.locked) return;
  const size=clamp(b.size*(0.5+0.7*pressure),4,b.maxSize||400);
  const fp=footprint('mop',size,0,0,b);
  forEachInDab(x,y,fp.rx,fp.ry,0,size>50?2:1,(px,py,i,rr,nx,ny)=>{
    if(!inSelection(px,py)) return;
    const fall=1-rr, amt=(b.flow||0.5)*fall*0.55;
    const wasDry=L.wet[i]<0.05;
    const settledEdge=L.edge[i]; // a dried "tide line" left behind by a previous wash
    L.wet[i]=clamp(L.wet[i]+amt*(1+(V.rewet/10)*0.6*L.pd[i]),0,1.7);
    L.pd[i]*=(1-amt*0.05);
    // Back-run / bloom: rewetting a dried, settled edge reactivates its concentrated pigment
    // and pushes it outward into a new ring rather than just diffusing evenly — the classic
    // watercolor "cauliflower" bloom you get when water hits a half-dry wash.
    if(wasDry && settledEdge>0.04 && amt>0.05){
      const pushDist=2+settledEdge*6;
      const ox=Math.round(px+nx*pushDist), oy=Math.round(py+ny*pushDist);
      if(ox>=0&&oy>=0&&ox<W&&oy<H && inSelection(ox,oy)){
        const oj=oy*W+ox;
        const moved=Math.min(L.pd[i]*0.4,0.5)*settledEdge;
        if(moved>0.001){
          const oOld=L.pd[oj], oTot=oOld+moved+1e-6;
          L.pr[oj]=(L.pr[oj]*oOld+L.pr[i]*moved)/oTot; L.pg[oj]=(L.pg[oj]*oOld+L.pg[i]*moved)/oTot; L.pb[oj]=(L.pb[oj]*oOld+L.pb[i]*moved)/oTot;
          L.pd[oj]=clamp(oTot,0,2.4);
          L.edge[oj]=clamp(L.edge[oj]+settledEdge*0.6,0,1);
          L.wet[oj]=clamp(L.wet[oj]+amt*0.5,0,1.7);
          L.pd[i]=Math.max(0,L.pd[i]-moved*0.6);
          growBounds(L,ox,oy);
        }
      }
      L.edge[i]*=0.3; // the old tide line is reactivated/dissolved now that it's rewet
    }
    growBounds(L,px,py);
  });
  L.dirty=true; markRenderDirty(x,y,size*0.7+6);
}
/* ---- Blow tool: pushes existing pooled water AND the pigment carried in it directionally,
   like real airflow across a wet wash — distinct from Blend/Smudge, which just mixes color
   between two points regardless of how wet either one is. Only acts where there's already
   meaningful wetness; blowing on dry paper does nothing, matching real watercolor behavior. ---- */
function toolBlow(L,x,y,dx,dy,pressure,b){
  if(!L||L.locked) return;
  const dlen=Math.hypot(dx,dy);
  if(dlen<0.5) return; // no travel direction yet (first sample of the stroke)
  const ux=dx/dlen, uy=dy/dlen;
  const size=clamp(b.size*(0.45+0.7*pressure),4,b.maxSize||400);

function toolDry(L,x,y,pressure,b){

  forEachInDab(x,y,size*0.55,size*0.55,0,size>50?2:1,(px,py,i,rr)=>{
    if(!inSelection(px,py)) return;
    const fall=1-rr, amt=(b.flow||0.5)*fall*0.5;

}
function toolEraser(L,x,y,pressure,b){

  forEachInDab(x,y,size*0.5,size*0.5,0,size>50?2:1,(px,py,i,rr)=>{
    if(!inSelection(px,py)) return;

function smearAt(L,x,y,srcx,srcy,pressure,b,strength){
  if(!L||L.locked) return;

  const sdx=srcx-x, sdy=srcy-y;
  const s=strength!=null?strength:(b.strength!=null?b.strength:0.5);
  forEachInDab(x,y,size*0.5,size*0.5,0,size>50?2:1,(px,py,i,rr)=>{
    if(!inSelection(px,py)) return;
    const sx=Math.round(px+sdx), sy=Math.round(py+sdy);
    if(sx<0||sy<0||sx>=W||sy>=H) return;
    const j=sy*W+sx;
    // A pixel with near-zero coverage holds no real pigment — its stored r/g/b is an
    // arbitrary default (black), not a color that's actually visible. Skip smudging FROM
    // such an "empty" source, and never let an "empty" destination blend color from black.
    const covJ=clamp(L.pd[j],0,1);

    const a=clamp(s*(1-rr)*covJ,0,1);

    } else {
      L.pr[i]=lerp(L.pr[i],L.pr[j],a); L.pg[i]=lerp(L.pg[i],L.pg[j],a); L.pb[i]=lerp(L.pb[i],L.pb[j],a);
    }

/* ---- Quick Fill (Selection tool, PRO): instantly fill the active selection with the

function quickFillSelection(){

  const L=activeLayer(); if(!L||L.locked) return;
  pushUndo();

  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x; if(selectionMask[i]!==1) continue;
    L.pr[i]=col.r; L.pg[i]=col.g; L.pb[i]=col.b; L.pd[i]=Math.max(L.pd[i],1.4);
    if(x<bminx)bminx=x; if(x>bmaxx)bmaxx=x; if(y<bminy)bminy=y; if(y>bmaxy)bmaxy=y;
    count++;

  if(count>0){ L.dirty=true; markRenderDirty((bminx+bmaxx)/2,(bminy+bmaxy)/2,Math.max(bmaxx-bminx,bmaxy-bminy)/2+4); }

function toolFill(L,x,y,b){
  if(!L||L.locked) return;

  const col=currentColorRGB();

  const tR=L.pr[i0],tG=L.pg[i0],tB=L.pb[i0],tD=L.pd[i0];
  const contiguous = b.contiguous!==false;
  let count=0; let bminx=W,bmaxx=0,bminy=H,bmaxy=0;
  const apply=(i,px,py)=>{
    L.pr[i]=col.r; L.pg[i]=col.g; L.pb[i]=col.b; L.pd[i]=Math.max(L.pd[i],(b.opacity||1)*1.4);
    if(b.wetLayer) L.wet[i]=clamp(L.wet[i]+0.5,0,1.6);
    count++;

  };
  if(contiguous){
    const visited=new Uint8Array(N);
    const stack=[i0]; const maxCount=N;
    while(stack.length && count<maxCount){
      const i=stack.pop();
      if(visited[i]) continue; visited[i]=1;
      const dr=Math.abs(L.pr[i]-tR),dg=Math.abs(L.pg[i]-tG),db=Math.abs(L.pb[i]-tB),dd=Math.abs(L.pd[i]-tD);
      if((dr+dg+db)/765>tol || dd>tol*2.4+0.02) continue;
      const px=i%W, py=(i/W)|0;
      if(!inSelection(px,py)) continue;
      apply(i,px,py);
      if(px>0) stack.push(i-1); if(px<W-1) stack.push(i+1);
      if(py>0) stack.push(i-W); if(py<H-1) stack.push(i+W);
    }
    if(b.wetLayer) growBounds(L,x,y);
  } else {
    for(let py=0;py<H;py++)for(let px=0;px<W;px++){
      if(!inSelection(px,py)) continue;
      const i=py*W+px;
      const dr=Math.abs(L.pr[i]-tR),dg=Math.abs(L.pg[i]-tG),db=Math.abs(L.pb[i]-tB),dd=Math.abs(L.pd[i]-tD);

}
function toolPick(x,y){

  const d=image.data;

/* ---------- simulation (diffusion / drying / granulation / drips) ----------
   Diffusion spreads pigment/wetness to the 4 direct neighbors every step (isotropic, like
   real ink bleeding through paper fibers) instead of "teleporting" it several pixels in one
   noise-picked direction. The old approach reused the same near-deterministic direction for
   the same pixel across many consecutive frames (the noise function only depended on pixel
   position, not meaningfully on time), so a stray hop kept getting reinforced in the same
   direction frame after frame — that's what produced the thin radiating "spike" artifacts.
   Gravity (Canvas Tilt) still biases the neighbor weights so wet paint genuinely flows
   downhill, but the SHAPE of that flow now emerges from many small, physically-grounded
   steps rather than a single big deterministic jump. */
/* ---- Deterministic water + pigment transport (the wet-on-wet core) ----
   WHY THIS EXISTS. All transport used to live inside simulateLayer's random-sample loop, which
   visits only ~10% of the wet area per frame — so any individual pixel was touched about once
   every ten frames. Measured consequence: a 40px-wide pure water wash spread by 2 PIXELS over
   120 frames (two full seconds), and a stroke painted onto soaking wet paper ended up just 4px
   wider than the same stroke on dry paper. Both are indistinguishable from "wet-on-wet isn't
   implemented", which is exactly how it read. Random sampling is fine for drying and
   granulation, but diffusion fundamentally needs every cell stepped, or the gradient never
   actually propagates.
   Two further problems the old loop had, both fixed here:
     - wetness only ever moved as a side effect of PIGMENT moving (the transfer sat inside an
       `if(pd>0.003)` branch), so plain water — which carries no pigment at all — could never
       spread, soften its edge, or wick into surrounding dry paper.
     - the source pixel gave up only 90% of what the destination gained, so every hop created
       10% pigment from nothing, compounding into washes that darkened and muddied over time.
   APPROACH. A real grid sweep, but banded across frames to bound the per-frame cost: the wet
   bounding box is divided into WET_BANDS horizontal strips and one strip is stepped per frame,
   so every wet pixel gets a true diffusion step several times per second while the work done in
   any single frame stays proportional to (wet area / WET_BANDS). The sweep direction alternates
   each frame, which cancels most of the directional bias an in-place sequential sweep would
   otherwise introduce (a double-buffered Jacobi step would remove it entirely, but that costs
   another full-canvas Float32Array per layer for a difference that isn't visible here).
   Water moves first, down its own wetness gradient; pigment then rides the water, with mobility
   rising superlinearly in wetness so a soaked area bleeds freely while barely-damp paper holds
   its mark. Both respect Canvas Tilt, so a tilted canvas genuinely runs downhill. */
// Per-frame cell budget. Rather than a fixed number of bands, the number of bands is derived
// from the wet area so the cost of a frame is bounded no matter how much of the canvas is wet.
// The important consequence is that a NORMAL wet area — one stroke, or a patch of water, i.e.
// well under the budget — is stepped in FULL every single frame, which is what makes bleeding
// look immediate and continuous. Only an unusually large wet region (a whole-canvas wash) gets
// split across frames, degrading gracefully into a slightly slower spread instead of a
// framerate collapse. Measured at ~200k cells: comfortably inside a 60fps frame.
const WET_CELL_BUDGET=200000;
function diffuseWetBands(L,diffF,edgeF,tiltOn,gDirX,gDirY,gStrength){
  const b=L.wetBounds; if(!b) return false;
  // Capture the sweep extents ONCE. growBounds() below can enlarge L.wetBounds mid-sweep, and
  // reading b.maxx/b.maxy directly in the loop conditions would let the sweep chase its own
  // expanding bounds and run far past its intended budget within a single frame.
  const minx=b.minx, maxx=b.maxx, miny=b.miny, maxy=b.maxy;
  const bw=maxx-minx+1, bh=maxy-miny+1;
  if(bw<=0||bh<=0) return false;
  const bands=Math.max(1,Math.ceil((bw*bh)/WET_CELL_BUDGET));
  const bandH=Math.max(1,Math.ceil(bh/bands));
  const band=(L._wetBand=((L._wetBand||0)+1)%bands);
  const y0=miny+band*bandH; if(y0>maxy) return false;
  const y1=Math.min(maxy,y0+bandH-1);
  const rev=(L._sweepFlip=!L._sweepFlip);
  // Fast path: when there is no selection and no masking-fluid layer, diffusionAllowed()
  // reduces to a bounds test. Calling it per neighbour per cell (millions of times a second)
  // was itself a large part of the measured frame cost, so the common case is inlined.
  const fastAllow=!selectionMask && !maskLayersCache.length;
  const DX=[1,-1,0,0], DY=[0,0,1,-1];
  let anyWet=false;
  for(let y=y0;y<=y1;y++){
    for(let n=0;n<bw;n++){
      const x=rev?(maxx-n):(minx+n);
      const i=y*W+x;
      const w=L.wet[i];
      if(w<0.015) continue;
      anyWet=true;
      const d=L.pd[i];
      const absorbHere=0.55+absorbMap[i]*0.9;
      const pigMob=d>0.003 ? Math.pow(w>1.7?1.7:w,1.5)*diffF*0.22 : 0;
      for(let k=0;k<4;k++){
        const nx=x+DX[k], ny=y+DY[k];
        const inb=nx>=0&&ny>=0&&nx<W&&ny<H;
        if(!inb || (!fastAllow && !diffusionAllowed(L,nx,ny))){
          // A real boundary (canvas edge / selection edge / masking fluid): water pools
          // against it and the pigment it carries concentrates there — the classic hard edge
          // of a taped-off wash.
          if(d>0.003) L.edge[i]=clamp(L.edge[i]+w*edgeF*0.025,0,1);
          continue;
        }
        const j=ny*W+nx;
        // Gravity bias (Canvas Tilt): downhill neighbours receive proportionally more.
        let gw=1;
        if(tiltOn){ const align=DX[k]*gDirX+DY[k]*gDirY; gw=1+Math.max(0,align)*gStrength*2.6; }
        const wi=L.wet[i], wj=L.wet[j];
        let moved=0;
        // 1) Diffusion: water flows down its own wetness gradient.
        const dw=wi-wj;
        if(dw>0.006) moved=dw*0.22*diffF*gw*absorbHere;
        // 2) Capillary wicking. Pure diffusion spreads as sqrt(time), which is far too slow to
        //    look like paper wetting — it produced a 2px advance over two seconds. Real paper
        //    wicks: fibres actively draw water into DRY neighbours, giving a front that
        //    advances at a roughly steady rate. This adds a gradient-independent term whenever
        //    a well-wetted cell borders a much drier one, which is what makes a wash visibly
        //    creep outward and soften its own edge instead of sitting as a hard-edged patch.
        if(wi>0.10 && wj<wi*0.8){
          moved+=Math.min(wi*0.055*diffF*gw*absorbHere, (wi-wj)*0.5);
        }
        if(moved>0.0002){
          if(moved>wi*0.24) moved=wi*0.24; // keep the explicit step stable
          L.wet[j]=clamp(wj+moved,0,1.7);
          L.wet[i]=Math.max(0,wi-moved);
          if(nx<b.minx||nx>b.maxx||ny<b.miny||ny>b.maxy) growBounds(L,nx,ny);
        }
        // 3) Pigment rides the water. Strictly mass-conserving.
        if(pigMob>0){
          const transfer=L.pd[i]*pigMob*gw*0.25;
          if(transfer>0.00004){
            const od=L.pd[j], tot=od+transfer+1e-6;
            L.pr[j]=(L.pr[j]*od+L.pr[i]*transfer)/tot;
            L.pg[j]=(L.pg[j]*od+L.pg[i]*transfer)/tot;
            L.pb[j]=(L.pb[j]*od+L.pb[i]*transfer)/tot;
            L.pd[j]=clamp(tot,0,2.4);
            L.pd[i]=Math.max(0,L.pd[i]-transfer);
            const grad=Math.abs(L.wet[i]-L.wet[j]);
            if(grad>0.05) L.edge[i]=clamp(L.edge[i]+grad*edgeF*0.018,0,1);
            if(nx<b.minx||nx>b.maxx||ny<b.miny||ny>b.maxy) growBounds(L,nx,ny);
          }
        }
      }
    }
  }
  return anyWet;
}
function simulateLayer(L){
  if(!L.wetBounds) return false;
  const b=L.wetBounds;
  const bw=b.maxx-b.minx+1, bh=b.maxy-b.miny+1;
  const area=bw*bh; if(area<=0){ L.wetBounds=null; return false; }
  const samples=Math.min(24000, Math.max(1000, area*0.10));
  let anyWet=false;
  const absF=V.absorbency/10, diffF=V.diffusionSpeed/10, edgeF=V.edgeDarkening/10;
  const granOn=V.granulation, granStr=V.granStrength/10, granDen=V.granDensity/10, granSeed=GRAN_SEED[V.granPreset]||11.3;
  // Canvas Tilt: biases which neighbor gets the most pigment/water each step, so over many
  // steps the wash visibly drifts downhill instead of spreading in a perfect circle.
  const tiltOn=canvasTilt.enabled && canvasTilt.strength>0.001;
  const gStrength=tiltOn?clamp(canvasTilt.strength,0,1):0;
  const gRad=canvasTilt.angle*Math.PI/180;
  const gDirX=tiltOn?Math.cos(gRad):0, gDirY=tiltOn?Math.sin(gRad):1;
  const flowBoost=tiltOn?(1+gStrength*1.6):1;
  // 4-neighbor offsets, reused per sample.
  const NB_DX=[1,-1,0,0], NB_DY=[0,0,1,-1];
  for(let s=0;s<samples;s++){
    const x=(b.minx+Math.random()*bw)|0, y=(b.miny+Math.random()*bh)|0;
    const i=y*W+x, w=L.wet[i];
    if(w<0.015) continue;
    anyWet=true;
    // Water/pigment TRANSPORT is no longer done here — it runs in diffuseWetBands() below,
    // as a deterministic sweep. This random-sample pass now only handles the two effects that
    // genuinely suit stochastic sampling: granulation (which wants randomness anyway) and
    // drying (an approximate per-pixel rate where sampling error is invisible).
    const d=L.pd[i];
    if(d>0.003 && granOn && d>0.02 && Math.random()<0.22){
      const t = (V.granPreset==='custom' && customGranTex) ? sampleTexTiled(customGranTex,x,y,4) : toothMap[i];
      const gn=noise(x*0.16+granSeed,y*0.16-granSeed);
      if(gn<granDen*0.7) L.pd[i]=clamp(L.pd[i]*(1+granStr*t*0.022),0,2.4);
      else L.pd[i]=clamp(L.pd[i]*(1-granStr*t*0.006),0,2.4);
    }
    const dryRate=0.0035+absF*0.02+toothMap[i]*0.002;
    L.wet[i]=Math.max(0,w-dryRate-w*0.01);
  }
  if(diffuseWetBands(L,diffF,edgeF,tiltOn,gDirX,gDirY,gStrength)) anyWet=true;
  let rivuletsActive=false;
  if(V.createDrips) rivuletsActive=updateRivulets(L,tiltOn,gDirX,gDirY,gStrength);
  L._shrinkTick=(L._shrinkTick||0)+1;
  if(L._shrinkTick>40){ L._shrinkTick=0; recomputeBounds(L); }
  return anyWet||rivuletsActive;
}
/* ---- Rivulet drips ----
   Real running drips are a handful of persistent, coherent streams with a stable width and
   a slight wobble — not thousands of independent one-frame line stamps rolled from random
   points every tick (which is what produced the disconnected porcupine spikes). This tracks
   a small list of active rivulets per layer; each one advances a little every frame, tapers
   as it uses up the puddle feeding it, and only new ones spawn from genuinely overloaded
   (very wet + pigment-bearing) puddle pixels — capped in count so they read as a few real
   drips, not a burst of noise. */
function updateRivulets(L,tiltOn,gDirX,gDirY,gStrength){
  if(!L.rivulets) L.rivulets=[];
  const maxActive=6;
  const hadRivuletsBefore=L.rivulets.length>0;
  // Advance existing rivulets.
  for(let ri=L.rivulets.length-1; ri>=0; ri--){
    const r=L.rivulets[ri];
    const i=Math.round(r.y)*W+Math.round(r.x);
    const feed = (i>=0&&i<N) ? L.wet[i] : 0;
    if(feed<0.25 || r.life<=0){ L.rivulets.splice(ri,1); continue; }
    r.life-=1;
    // Slight organic wobble so the stream isn't a perfectly straight line.
    const wob=(noise(r.x*0.15,r.seed+r.steps*0.08)-0.5)*0.6;
    const dx=r.dirx+wob*0.35, dy=r.diry+ (tiltOn?0:0.02);
    const len=Math.hypot(dx,dy)||1;
    r.x+=dx/len*1.6; r.y+=dy/len*1.6; r.steps++;
    if(r.x<1||r.y<1||r.x>=W-1||r.y>=H-1 || !diffusionAllowed(L,Math.round(r.x),Math.round(r.y))){ L.rivulets.splice(ri,1); continue; }
    const cx=Math.round(r.x), cy=Math.round(r.y);
    const rad=Math.max(1,r.width);
    for(let oy=-rad;oy<=rad;oy++){
      for(let ox=-rad;ox<=rad;ox++){
        const dist=Math.hypot(ox,oy); if(dist>rad) continue;
        const xx=cx+ox, yy=cy+oy; if(xx<0||yy<0||xx>=W||yy>=H) continue;
        if(!diffusionAllowed(L,xx,yy)) continue;
        const fall=1-dist/(rad+0.001);
        const jj=yy*W+xx;
        L.wet[jj]=clamp(Math.max(L.wet[jj],r.wet*fall),0,1.6);
        const dep=r.pigment*fall*0.35;
        if(dep>0.0005){
          const od=L.pd[jj], tot=od+dep+1e-6;
          L.pr[jj]=(L.pr[jj]*od+r.pr*dep)/tot; L.pg[jj]=(L.pg[jj]*od+r.pg*dep)/tot; L.pb[jj]=(L.pb[jj]*od+r.pb*dep)/tot;
          L.pd[jj]=clamp(tot,0,2.4);
        }
        growBounds(L,xx,yy);
      }
    }
    // Taper: the rivulet slowly consumes the puddle wetness feeding it and thins as it runs.
    L.wet[i]=Math.max(0,feed-0.02);
    r.wet*=0.985; r.pigment*=0.99; r.width=Math.max(0.6,r.width*0.996);
  }
  // Spawn new rivulets from overloaded puddle pixels (only when tilt/drip conditions call
  // for it), capped so at most a few run at once.
  if(L.rivulets.length>=maxActive || !L.wetBounds) return hadRivuletsBefore||L.rivulets.length>0;
  const b=L.wetBounds, bw=b.maxx-b.minx+1, bh=b.maxy-b.miny+1;

  if(k==='.'){ fitCanvas(); e.preventDefault(); return; }
  if(k==='g'){ toggleGreyscalePreview(); e.preventDefault(); return; }
  const match=TOOL_SHORTCUTS.find(s=>s.key===k && s.shift===e.shiftKey);
  if(match){ setTool(match.tool); e.preventDefault(); }
});

function transformGeometry(t){
  const cx=t.x+t.w/2, cy=t.y+t.h/2;
  const rad=t.angle*Math.PI/180, cos=Math.cos(rad), sin=Math.sin(rad);
  const hw=t.w/2, hh=t.h/2;
  const corner=(lx,ly)=>({x:cx+(lx*cos-ly*sin),y:cy+(lx*sin+ly*cos)});
  const tl=corner(-hw,-hh), tr=corner(hw,-hh), bl=corner(-hw,hh), br=corner(hw,hh);
  const topMid={x:(tl.x+tr.x)/2,y:(tl.y+tr.y)/2};
  const rotHandle=corner(0,-hh-40);
  return {cx,cy,tl,tr,bl,br,topMid,rotHandle};
}
function hitTestTransformHandle(p,t){
  const g=transformGeometry(t);
  const r=Math.max(6,14*100/zoomPct);
  const near=pt=>dist(p,pt)<=r;
  if(near(g.rotHandle)) return 'rotate';
  if(near(g.tl)) return 'scale-tl'; if(near(g.tr)) return 'scale-tr';
  if(near(g.bl)) return 'scale-bl'; if(near(g.br)) return 'scale-br';
  const rad=-t.angle*Math.PI/180, dx=p.x-g.cx, dy=p.y-g.cy;
  const lx=dx*Math.cos(rad)-dy*Math.sin(rad), ly=dx*Math.sin(rad)+dy*Math.cos(rad);
  if(Math.abs(lx)<=t.w/2 && Math.abs(ly)<=t.h/2) return 'move';
  return null;
}
function initTransformState(){
  const L=activeLayer(); if(!L) return null;
  const b=selectionMask?maskBoundsOf(selectionMask):{x0:0,y0:0,w:W,h:H};
  if(!b||b.w<=0||b.h<=0) return null;
  const w=b.w,h=b.h;
  const snapCanvas=document.createElement('canvas'); snapCanvas.width=w; snapCanvas.height=h;
  const sctx=snapCanvas.getContext('2d');
  const id=sctx.createImageData(w,h);
  for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){
    const i=(b.y0+yy)*W+(b.x0+xx), j=(yy*w+xx)*4;
    const a=clamp(L.pd[i],0,1);
    id.data[j]=L.pr[i]; id.data[j+1]=L.pg[i]; id.data[j+2]=L.pb[i]; id.data[j+3]=a*255;
  }
  sctx.putImageData(id,0,0);
  for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){ const i=(b.y0+yy)*W+(b.x0+xx); L.pr[i]=0;L.pg[i]=0;L.pb[i]=0;L.pd[i]=0; }
  markRenderDirty(b.x0+w/2,b.y0+h/2,Math.max(w,h)/2+8);
  const previewEl=document.createElement('img'); previewEl.className='transformPreviewImg'; previewEl.src=snapCanvas.toDataURL();
  document.getElementById('paperMat').appendChild(previewEl);
  return {L,srcCanvas:snapCanvas,srcImageData:id,srcW:w,srcH:h,origX0:b.x0,origY0:b.y0,origW:w,origH:h,
    x:b.x0,y:b.y0,w,h,angle:0,flipH:1,flipV:1,previewEl};
}
function updateTransformPreviewCSS(){
  const t=transformState; if(!t||!t.previewEl) return;
  const scale=canvas.clientWidth/W;
  t.previewEl.style.left=(canvas.offsetLeft+t.x*scale)+'px';
  t.previewEl.style.top=(canvas.offsetTop+t.y*scale)+'px';
  t.previewEl.style.width=(t.w*scale)+'px'; t.previewEl.style.height=(t.h*scale)+'px';
  t.previewEl.style.transform=`rotate(${t.angle}deg) scale(${t.flipH},${t.flipV})`;

function renderTransformOverlay(){
  if(!selMaskOverlayCtx) return;
  selMaskOverlayCtx.clearRect(0,0,W,H);
  if(!transformState) return;
  const t=transformState, g=selMaskOverlayCtx, geo=transformGeometry(t);
  g.save(); g.strokeStyle='#5bb8ec'; g.lineWidth=Math.max(1,150/zoomPct);
  g.beginPath(); g.moveTo(geo.tl.x,geo.tl.y); g.lineTo(geo.tr.x,geo.tr.y); g.lineTo(geo.br.x,geo.br.y); g.lineTo(geo.bl.x,geo.bl.y); g.closePath(); g.setLineDash([6,4]); g.stroke();
  g.setLineDash([]); g.beginPath(); g.moveTo(geo.topMid.x,geo.topMid.y); g.lineTo(geo.rotHandle.x,geo.rotHandle.y); g.stroke();
  const r=Math.max(5,9*100/zoomPct);
  g.fillStyle='#5bb8ec'; g.strokeStyle='#0b1720'; g.lineWidth=Math.max(1,100/zoomPct);
  [geo.tl,geo.tr,geo.bl,geo.br].forEach(pt=>{ g.beginPath(); g.rect(pt.x-r/2,pt.y-r/2,r,r); g.fill(); g.stroke(); });
  g.beginPath(); g.arc(geo.rotHandle.x,geo.rotHandle.y,r/2,0,Math.PI*2); g.fill(); g.stroke();

function syncTransformFields(){
  const t=transformState; if(!t) return;

function startTransformInteraction(p,e){

}
function updateTransformInteraction(p,e){
  if(!transformDrag||!transformState) return;
  const t=transformState, d=transformDrag, o=d.orig;
  if(d.handle==='move'){
    t.x=o.x+(p.x-d.startP.x); t.y=o.y+(p.y-d.startP.y);
  } else if(d.handle==='rotate'){
    const cx=o.x+o.w/2, cy=o.y+o.h/2;

    let angle=o.angle+(a1-a0)*180/Math.PI;

    t.angle=angle;
  } else if(d.handle.startsWith('scale-')){
    const cx=o.x+o.w/2, cy=o.y+o.h/2;
    const rad=-o.angle*Math.PI/180;
    const lx=(p.x-cx)*Math.cos(rad)-(p.y-cy)*Math.sin(rad), ly=(p.x-cx)*Math.sin(rad)+(p.y-cy)*Math.cos(rad);
    const signX=d.handle.includes('r')?1:-1, signY=d.handle.includes('b')?1:-1;
    let newHalfW=Math.max(6,signX*lx), newHalfH=Math.max(6,signY*ly);
    if(!e.shiftKey){ const s=Math.max(newHalfW/(o.w/2),newHalfH/(o.h/2)); newHalfW=(o.w/2)*s; newHalfH=(o.h/2)*s; }
    const newW=newHalfW*2, newH=newHalfH*2;

    else {
      const cosA=Math.cos(o.angle*Math.PI/180), sinA=Math.sin(o.angle*Math.PI/180);
      const anchorLocal={x:-signX*(o.w/2),y:-signY*(o.h/2)};
      const anchorWorld={x:cx+(anchorLocal.x*cosA-anchorLocal.y*sinA),y:cy+(anchorLocal.x*sinA+anchorLocal.y*cosA)};
      const newAnchorLocal={x:-signX*newHalfW,y:-signY*newHalfH};
      const newCenter={x:anchorWorld.x-(newAnchorLocal.x*cosA-newAnchorLocal.y*sinA),y:anchorWorld.y-(newAnchorLocal.x*sinA+newAnchorLocal.y*cosA)};
      t.w=newW; t.h=newH; t.x=newCenter.x-newW/2; t.y=newCenter.y-newH/2;
    }
  }
  updateTransformPreviewCSS(); renderTransformOverlay(); syncTransformFields();
}
function resetTransformState(){
  const t=transformState; if(!t) return;

  updateTransformPreviewCSS(); renderTransformOverlay(); syncTransformFields();
}
function cleanupTransform(){
  const t=transformState;
  if(t&&t.previewEl&&t.previewEl.parentNode) t.previewEl.parentNode.removeChild(t.previewEl);
  transformState=null; transformDrag=null;
  if(selMaskOverlayCtx) selMaskOverlayCtx.clearRect(0,0,W,H);
  buildPropertiesPanel();
}
function confirmTransform(){
  const t=transformState; if(!t) return;
  const L=t.L;
  const pad=Math.ceil(Math.hypot(t.w,t.h))+4;
  const outCanvas=document.createElement('canvas'); outCanvas.width=pad*2; outCanvas.height=pad*2;
  const octx=outCanvas.getContext('2d');
  octx.translate(pad,pad); octx.rotate(t.angle*Math.PI/180); octx.scale(t.flipH,t.flipV);
  octx.drawImage(t.srcCanvas,-t.w/2,-t.h/2,t.w,t.h);
  const cx=t.x+t.w/2, cy=t.y+t.h/2;
  const id=octx.getImageData(0,0,pad*2,pad*2);
  for(let yy=0;yy<pad*2;yy++){
    const ty=Math.floor(cy-pad)+yy; if(ty<0||ty>=H) continue;
    for(let xx=0;xx<pad*2;xx++){
      const tx=Math.floor(cx-pad)+xx; if(tx<0||tx>=W) continue;
      const j=(yy*(pad*2)+xx)*4, a=id.data[j+3]/255; if(a<=0.003) continue;
      const i=ty*W+tx;
      L.pr[i]=id.data[j]; L.pg[i]=id.data[j+1]; L.pb[i]=id.data[j+2]; L.pd[i]=a;
    }

}
function cancelTransform(){
  const t=transformState; if(!t) return;
  const L=t.L;
  for(let yy=0;yy<t.srcH;yy++)for(let xx=0;xx<t.srcW;xx++){
    const i=(t.origY0+yy)*W+(t.origX0+xx), j=(yy*t.srcW+xx)*4;
    L.pr[i]=t.srcImageData.data[j]; L.pg[i]=t.srcImageData.data[j+1]; L.pb[i]=t.srcImageData.data[j+2]; L.pd[i]=t.srcImageData.data[j+3]/255;
  }
  markRenderDirty(t.origX0+t.origW/2,t.origY0+t.origH/2,Math.max(t.origW,t.origH)/2+8);
  cleanupTransform();
  setStatus('Transform cancelled');
}

/* ---- Tools / Properties / Brushes ----
   Matches the real Rebelle Tools panel layout: a top row of large brush-type icons
   (the actual "media" tools — Oil, Watercolor, Ink, Pencil, Pastel, Marker, Airbrush,
   Favorite & Recent), then a compact grid below of the action tools (Blend, Smudge,
   Clone, Eraser, Fill, Pick Color, Undo, Water, Dry, Blow, Selection, Transform,
   Canvas Size, Redo) — instead of one flat 4-column grid mixing everything together. */
const TOOLS_PAINT_ROW=['oil','expressoil','watercolor','ink','pencil','pastel','marker','airbrush','favorite'];

const TOOLS_ACTION_GRID=['blend','smudge','clone','eraser','fill','pick','__undo','water','dry','blow','selection','transform','canvassize','__redo'];

    b.onclick=()=>setTool(t.id);

  });
  const actGrid=document.getElementById('toolsActionGrid'); actGrid.innerHTML='';
  TOOLS_ACTION_GRID.forEach(id=>{
    if(id==='__undo'){

      b.innerHTML=svg('<path d="M9 7L4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-1"/>');
      b.onclick=undo;
      actGrid.appendChild(b); return;
    }
    if(id==='__redo'){
      const b=document.createElement('button');
      b.className='toolActionBtn isAction'; b.id='toolsRedoBtn'; b.title='Redo (Ctrl+Shift+Z)';
      b.innerHTML=svg('<path d="M15 7l5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h1"/>');
      b.onclick=redo;
      actGrid.appendChild(b); return;
    }
    const t=TOOLS_BY_ID[id]; if(!t) return;

const PAINT_MODES_BY_ENGINE={
 oil:['paint','paintmix','paintblend','blend','erase'], expressoil:['paint','paintmix','paintblend','blend','erase'],
 watercolor:['paint','paintmix','paintblend','blend','erase'], ink:['paint','paintmix','paintblend','blend','erase'],

const MIXING_MODES=['transparent','semitransparent','opaque'];

function setBrush(key,keepTool){
  const preset=BRUSH_INDEX[key]; if(!preset) return;
  brush=Object.assign({},preset);
  if(brush.maxSize==null) brush.maxSize=clamp(brush.size*4,80,1500);
  if(brush.sizeBehavior==null) brush.sizeBehavior='pressure';
  if(brush.opacityBehavior==null) brush.opacityBehavior='pressure-soft';
  if(brush.tipTilt==null) brush.tipTilt=0;
  if(brush.brushForm==null) brush.brushForm=0;
  if(brush.smudgeOnStroke==null) brush.smudgeOnStroke=false;
  if(brush.length==null) brush.length=100;
  if(brush.jitter==null) brush.jitter={enabled:false,mode:'stamp',hue:0,sat:0,bright:0};
  // Defaults for the newer Marker/Pastel-driven Brush Creator mechanics (Size/Opacity
  // Jitter, Spacing Jitter, Scatter, Rotation mode, Shape Angle, Angle Jitter, Grain
  // Smoothing, Random Start/Stamp) — every one of these is a genuine, real engine field
  // consumed in footprint()/paint()/depositWet() (see the code there), not cosmetic-only.
  if(brush.sizeJitter==null) brush.sizeJitter=0;
  if(brush.opacityJitter==null) brush.opacityJitter=0;
  if(brush.spacingJitter==null) brush.spacingJitter=0;
  if(brush.scatter==null) brush.scatter=0;
  if(brush.rotationMode==null) brush.rotationMode='trajectory';
  if(brush.shapeAngle==null) brush.shapeAngle=0;
  if(brush.angleJitterDeg==null) brush.angleJitterDeg=0;
  if(brush.grainSmoothing==null) brush.grainSmoothing=false;
  if(brush.randomStart==null) brush.randomStart=false;
  if(brush.randomStamp==null) brush.randomStamp=false;

  // visually for existing brushes while making the Edge Softness slider functional for all.
  if(brush.edgeSoftness==null) brush.edgeSoftness=57;
  const modeOpts=PAINT_MODES_BY_ENGINE[brush.engine]||['paint','paintmix','paintblend','blend','erase'];
  if(brush.paintMode==null || !modeOpts.includes(brush.paintMode)) brush.paintMode=modeOpts.includes('paintmix')?'paintmix':'paint';
  brush.key=key;
  lastBrushForTool[brush.tool]=key;
  if(!keepTool) currentTool=brush.tool;
  recentBrushes=recentBrushes.filter(k=>k!==key); recentBrushes.unshift(key); if(recentBrushes.length>8) recentBrushes.pop();

let activeCategory=null;
function buildBrushesPanel(){
  const kind=TOOLS_BY_ID[currentTool].kind;
  const titleEl=document.getElementById('brushesTitle'), searchEl=document.getElementById('brushSearch');
  const catGrid=document.getElementById('catGrid'), list=document.getElementById('brushList');
  if(kind!=='paint'){
    titleEl.textContent='Brushes'; searchEl.style.display='none'; catGrid.innerHTML='';
    list.innerHTML='<p class="tinyNote">This tool has no brush presets — see Properties for its settings.</p>';
    return;
  }
  searchEl.style.display='block';
  const set=BRUSH_SETS[currentTool];
  titleEl.textContent=TOOLS_BY_ID[currentTool].name+' Brushes';
  const groupNames=Object.keys(set.groups);
  if(activeCategory && !groupNames.includes(activeCategory)) activeCategory=null;
  catGrid.innerHTML=groupNames.map(g=>`<button class="catSw ${g===activeCategory?'active':''}" data-cat="${g}" title="${g}">${catIcon(set.groups[g][0].shape)}</button>`).join('');
  catGrid.querySelectorAll('.catSw').forEach(b=>b.onclick=()=>{ activeCategory=(activeCategory===b.dataset.cat)?null:b.dataset.cat; buildBrushesPanel(); });
  renderBrushList(set,groupNames);
  searchEl.oninput=()=>renderBrushList(set,groupNames);
}
/* ---- Smarter Asset Management (PRO): multi-select (Ctrl/Shift-click) + drag-and-drop
   reordering for the brush list, so large "My Brushes" libraries are easier to organize. ---- */
let selectedBrushKeys=new Set();
let lastClickedBrushKey=null;
function renderBrushList(set,groupNames){
  const q=(document.getElementById('brushSearch').value||'').toLowerCase();
  const list=document.getElementById('brushList'); list.innerHTML='';
  if(selectedBrushKeys.size>1){
    const bar=document.createElement('div'); bar.className='bcActions'; bar.style.margin='0 0 6px';
    bar.innerHTML=`<span class="tinyNote" style="flex:1;align-self:center">${selectedBrushKeys.size} selected</span>
      <button class="qbtn" id="bulkRemoveBtn">Remove Selected</button>
      <button class="qbtn" id="bulkClearSelBtn">Clear Selection</button>`;
    list.appendChild(bar);
    bar.querySelector('#bulkRemoveBtn').onclick=()=>{
      const removable=[...selectedBrushKeys].filter(k=>{ const b=BRUSH_INDEX[k]; return b&&b.imported; });
      if(!removable.length){ setStatus('Only custom/imported brushes in "My Brushes" can be removed'); return; }
      if(confirm('Remove '+removable.length+' brush(es) from My Brushes?')){
        removable.forEach(k=>removeBrushFromLibrary(k));
        selectedBrushKeys.clear(); buildBrushesPanel();
      }
    };
    bar.querySelector('#bulkClearSelBtn').onclick=()=>{ selectedBrushKeys.clear(); buildBrushesPanel(); };
  }
  groupNames.forEach(g=>{
    if(activeCategory && g!==activeCategory && !q) return;
    const items=set.groups[g].filter(b=>!q||b.name.toLowerCase().includes(q));
    if(!items.length) return;
    const h=document.createElement('div'); h.className='groupTitle'; h.textContent=g; list.appendChild(h);
    const isReorderable=(g==='My Brushes');
    items.forEach((b,idx)=>{
      const el=document.createElement('button'); el.className='brushItem'
        +(brush&&brush.key===b.key?' active':'')+(selectedBrushKeys.has(b.key)?' multiSelected':'');
      el.draggable=isReorderable;
      el.dataset.brushKey=b.key; el.dataset.brushGroup=g;
      el.innerHTML=`<svg class="swoosh" viewBox="0 0 40 16"><path d="M2 13 C 10 3, 16 15, 22 7 S 34 3, 38 10" fill="none" stroke="#cfe6f7" stroke-width="${clamp(b.size/14,1,6)}" stroke-linecap="round" opacity="${clamp(b.opacity+0.2,0.2,1)}"/></svg>
        <div><div class="bi-name">${b.name}${b.needsShapeReview?' <span class="tinyNote" style="color:#f2b400" title="Imported from a Rebelle .png with no readable shape data — dynamics were guessed from the file name. Open Brush Creator to fine-tune.">⚠ review shape</span>':''}</div><div class="bi-sub">${b.shape} · water ${b.water.toFixed(2)}</div></div>
        ${b.imported?`<button class="star" data-remove="${b.key}" title="Remove from My Brushes">✕</button>`:''}
        <button class="star ${favorites[b.key]?'on':''}" data-fav="${b.key}">★</button>`;
      el.addEventListener('click',(e)=>{
        if(e.target.closest('[data-fav],[data-remove]')) return;
        if(e.ctrlKey||e.metaKey){
          if(selectedBrushKeys.has(b.key)) selectedBrushKeys.delete(b.key); else selectedBrushKeys.add(b.key);
          lastClickedBrushKey=b.key; renderBrushList(set,groupNames); return;
        }
        if(e.shiftKey && lastClickedBrushKey){
          const flat=items.map(x=>x.key);
          const a=flat.indexOf(lastClickedBrushKey), c=flat.indexOf(b.key);
          if(a>=0&&c>=0){ const [lo,hi]=a<c?[a,c]:[c,a]; for(let k=lo;k<=hi;k++) selectedBrushKeys.add(flat[k]); renderBrushList(set,groupNames); return; }
        }
        selectedBrushKeys.clear(); lastClickedBrushKey=b.key;
        setBrush(b.key);
      });
      if(isReorderable){
        el.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/brush-key',b.key); e.dataTransfer.effectAllowed='move'; });
        el.addEventListener('dragover',e=>{ e.preventDefault(); el.style.outline='2px solid #5bb8ec'; });
        el.addEventListener('dragleave',()=>{ el.style.outline=''; });
        el.addEventListener('drop',e=>{
          e.preventDefault(); el.style.outline='';
          const srcKey=e.dataTransfer.getData('text/brush-key'); if(!srcKey||srcKey===b.key) return;
          const arr=set.groups[g];
          const srcIdx=arr.findIndex(x=>x.key===srcKey), dstIdx=arr.findIndex(x=>x.key===b.key);
          if(srcIdx<0||dstIdx<0) return;
          const [moved]=arr.splice(srcIdx,1); arr.splice(dstIdx,0,moved);
          persistMyBrushes(); renderBrushList(set,groupNames);
        });
      }
      list.appendChild(el);
    });
  });
  list.querySelectorAll('[data-fav]').forEach(s=>s.addEventListener('click',(e)=>{ e.stopPropagation(); const k=s.dataset.fav; favorites[k]=!favorites[k]; s.classList.toggle('on'); }));
  list.querySelectorAll('[data-remove]').forEach(s=>s.addEventListener('click',(e)=>{ e.stopPropagation(); const k=s.dataset.remove; if(confirm('Remove this brush from My Brushes?')){ removeBrushFromLibrary(k); buildBrushesPanel(); } }));
}
